$("#tvBtn").addEventListener("click", () => {
  tv = !tv; document.body.classList.toggle("tv", tv);
  try { if (tv && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); else if (!tv && document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch (e) {}
  try { if (tv && navigator.wakeLock) navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
  render();
});
$("#exportBtn").addEventListener("click", exportAll);

/* ---------- offline mode: used when the file is opened outside Claude ---------- */
let offline = false;
function seedData() {
  const d = {};
  d["meta/config"] = { title: "Interhouse Futsal 2026", venue: "Champ Turf", date: "Friday 9 October 2026", courts: ["Court A", "Court B"], pin: "2026" };
  const H = [["cygnus", "Cygnus", "blue"], ["aquila", "Aquila", "gold"], ["draco", "Draco", "red"], ["orion", "Orion", "violet"]];
  H.forEach(([id, n, c], i) => {
    d["houses/" + id] = { name: n, color: c, order: i, tiebreakRank: 0 };
    for (let j = 1; j <= 6; j++) d[`players/${id}${j}`] = { name: `${n} Player ${j}`, houseId: id, gender: j === 6 ? "F" : "M", number: String(j), gk: j === 1 };
  });
  Object.assign(d, starterMatches(["cygnus", "aquila", "draco", "orion"]));
  return d;
}
/* The starting draw: 6 rounds, both courts busy every round, every pairing twice. ids = the 4 houses in order. */
function starterMatches(ids) {
  const P = [[[0, 1], [2, 3]], [[1, 3], [0, 2]], [[0, 3], [1, 2]], [[3, 2], [1, 0]], [[2, 0], [3, 1]], [[2, 1], [3, 0]]];
  const d = {}; let no = 1;
  P.forEach((r, ri) => r.forEach(([h, a], ci) => { d["matches/m" + String(no).padStart(2, "0")] = { no, round: ri + 1, court: ci, stage: "league", homeId: ids[h], awayId: ids[a], status: "scheduled", period: 1, running: false, elapsedMs: 0, time: "" }; no++; }));
  d["matches/final"] = { no: 13, round: 7, court: 0, stage: "final", homeId: null, awayId: null, status: "scheduled", period: 1, running: false, elapsedMs: 0, time: "" };
  return d;
}
function localDB() {
  const KEY = "futsal:offline-db";
  let mem = null;
  try { mem = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { mem = null; }
  if (!mem || !Object.keys(mem).length) mem = seedData();
  const subs = [];
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { toast("This browser won't save data. Don't use private browsing."); } };
  persist();
  const fire = () => setTimeout(() => subs.forEach(f => f()), 0);
  window.addEventListener("storage", e => { if (e.key === KEY) { try { mem = JSON.parse(e.newValue || "{}"); } catch (x) {} subs.forEach(f => f()); } });
  const snap = p => ({ id: p.split("/").pop(), exists: !!mem[p], data: () => mem[p] });
  const clone = o => JSON.parse(JSON.stringify(o));
  const doc = p => ({ id: p.split("/").pop(), path: p,
    async set(v) { mem[p] = clone(v); persist(); fire(); },
    async update(v) { if (!mem[p]) throw { code: "invalid_argument" }; Object.assign(mem[p], clone(v)); persist(); fire(); },
    async delete() { delete mem[p]; persist(); fire(); },
    onSnapshot(next) { const f = () => next(snap(p)); subs.push(f); f(); return () => {}; } });
  return { doc, collection: c => ({
    doc: id => doc(c + "/" + (id || ("x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7)))),
    onSnapshot(next) { const f = () => { const docs = Object.keys(mem).filter(k => k.startsWith(c + "/") && k.split("/").length === 2).map(snap); next({ docs }); }; subs.push(f); f(); return () => {}; } }) };
}
const localDownloads = { async save({ filename, data }) {
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data]));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  return { status: "saved" };
} };

/* ---------- Google Sheet mode: shared data through a Google Apps Script web app ---------- */
let sheetMode = false;
function setSync(state, n) {
  const el = $("#sync"); if (!el) return;
  el.hidden = false;
  el.className = "sync " + state;
  el.textContent = state === "ok" ? "Synced" : state === "saving" ? `Saving ${n} change${n === 1 ? "" : "s"}…` : state === "offline" ? (n ? `Offline · ${n} change${n === 1 ? "" : "s"} waiting` : "Offline · showing last synced data") : "Connecting…";
}
function sheetDB(api) {
  const QK = "futsal:sheet-queue", CK = "futsal:sheet-cache";
  let mem = {}, v = -1, key = ls.get("key") || "", queue = [], busy = false, again = false, timer = null, pinBad = false, fired = false;
  try { queue = JSON.parse(localStorage.getItem(QK) || "[]"); } catch (e) { queue = []; }
  try { const c = JSON.parse(localStorage.getItem(CK) || "null"); if (c && c.docs) mem = c.docs; } catch (e) {}
  const subs = [];
  const clone = o => JSON.parse(JSON.stringify(o));
  const saveQ = () => { try { localStorage.setItem(QK, JSON.stringify(queue)); } catch (e) {} };
  const saveC = () => { try { localStorage.setItem(CK, JSON.stringify({ v, docs: mem })); } catch (e) {} };
  const fire = () => { fired = true; subs.forEach(f => f()); };
  const apply = w => {
    if (w.op === "set") mem[w.path] = clone(w.data);
    else if (w.op === "update") { if (mem[w.path]) Object.assign(mem[w.path], clone(w.data)); }
    else if (w.op === "delete") delete mem[w.path];
  };
  async function post(body) {
    const r = await fetch(api, { method: "POST", body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw j;
    return j;
  }
  async function flush() {
    while (queue.length && !pinBad) {
      const chunk = queue.slice(0, 40);
      setSync("saving", queue.length);
      try { await post({ op: "batch", key, writes: chunk }); }
      catch (e) {
        if (e && e.error === "bad_pin") { pinBad = true; unlocked = false; ls.set("unlocked", "0"); toast("The sheet rejected the PIN. Unlock the Scorer again to send waiting changes."); schedule(); }
        throw e;
      }
      queue.splice(0, chunk.length); saveQ();
    }
  }
  async function pull() {
    const r = await fetch(api + (api.includes("?") ? "&" : "?") + "v=" + v + "&t=" + Date.now());
    const j = await r.json();
    if (!j.ok) throw j;
    if (!j.unchanged) { mem = j.docs || {}; v = j.v; queue.forEach(apply); saveC(); fire(); }
  }
  async function cycle() {
    if (busy) { again = true; return; }
    busy = true;
    try { await flush(); await pull(); setSync(queue.length ? "offline" : "ok", queue.length); }
    catch (e) { setSync("offline", queue.length); if (!fired) fire(); }
    busy = false;
    if (again) { again = false; setTimeout(cycle, 50); }
  }
  const kick = () => { clearTimeout(timer); timer = setTimeout(cycle, 120); };
  setInterval(cycle, 3000);
  window.addEventListener("online", kick);
  setSync("wait");
  setTimeout(() => { if (Object.keys(mem).length) fire(); cycle(); }, 0);
  const write = (op, path, data) => { const w = { op, path }; if (data) w.data = clone(data); apply(w); queue.push(w); saveQ(); fire(); kick(); };
  const doc = p => ({ id: p.split("/").pop(), path: p,
    async set(d) { write("set", p, d); },
    async update(d) { if (!mem[p]) throw { code: "invalid_argument" }; write("update", p, d); },
    async delete() { write("delete", p); },
    onSnapshot(next) { const f = () => next({ id: p.split("/").pop(), exists: !!mem[p], data: () => mem[p] }); subs.push(f); return () => {}; } });
  return {
    doc,
    collection: c => ({
      doc: id => doc(c + "/" + (id || ("x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7)))),
      onSnapshot(next) { const f = () => next({ docs: Object.keys(mem).filter(k => k.startsWith(c + "/") && k.split("/").length === 2).map(k => ({ id: k.split("/")[1], exists: true, data: () => mem[k] })) }); subs.push(f); return () => {}; } }),
    async auth(pin) { await post({ op: "auth", key: pin }); key = pin; ls.set("key", pin); pinBad = false; kick(); },
    async changePin(pin) { await flush(); await post({ op: "update", key, path: "meta/config", data: { pin } }); key = pin; ls.set("key", pin); kick(); },
    async replaceAll(docs) { await post({ op: "replaceAll", key, docs }); queue = []; saveQ(); v = -1; await pull(); },
    pending: () => queue.length
  };
}

/* ---------- CSV backup & restore ---------- */
function csvCell(x) { const t = x == null ? "" : String(x); return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }
function toCSV(rows) { return "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n"); }
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c !== ""));
}
function allDocs() {
  const out = {};
  if (S.config) out["meta/config"] = { ...S.config };
  ["houses", "players", "matches", "events", "kicks"].forEach(cn => Object.values(S[cn]).forEach(d => { const x = { ...d }; delete x.id; out[cn + "/" + d.id] = x; }));
  return out;
}
function docSummary(path, d) {
  const [cn] = path.split("/");
  if (cn === "meta") return `${d.title || ""} · ${d.venue || ""}`;
  if (cn === "houses") return d.name;
  if (cn === "players") return `${d.name} · ${hname(d.houseId)}${d.gk ? " · GK" : ""}${d.gender === "F" ? " · W" : ""}`;
  if (cn === "matches") { const m = S.matches[path.split("/")[1]]; const sc = m && L.started(m) ? L.score(S, m) : null; return `${d.stage === "final" ? "Final" : "M" + d.no} · ${hname(d.homeId)} ${sc ? sc.h + "-" + sc.a : "v"} ${hname(d.awayId)} · ${d.status}`; }
  if (cn === "events") { const m = S.matches[d.matchId]; return `${m ? (m.stage === "final" ? "Final" : "M" + m.no) : ""} ${m ? L.minuteOf(d, m, C()) + "'" : ""} · ${d.type}${d.ownGoal ? " (own goal)" : ""} · ${hname(d.houseId)} · ${d.playerId ? pname(d.playerId) : ""}${d.assistId ? " (assist " + pname(d.assistId) + ")" : ""}${d.outId ? " for " + pname(d.outId) : ""}`; }
  if (cn === "kicks") return `Shootout · ${hname(d.houseId)} · ${pname(d.kickerId)} · ${d.result}`;
  return "";
}
async function saveText(name, text) {
  if (!dl) return toast("Downloads aren't available in this view.");
  try { await dl.save({ filename: name, data: new Blob([text], { type: "text/csv" }) }); toast("Saved " + name); return true; }
  catch (e) { if (e && e.code !== "declined") toast("Couldn't save the file."); return false; }
}
const stamp = () => { const d = new Date(), z = n => String(n).padStart(2, "0"); return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}`; };
async function downloadBackup() {
  const docs = allDocs();
  const order = ["meta", "houses", "players", "matches", "events", "kicks"];
  const rows = [["collection", "id", "summary", "data"]];
  Object.keys(docs).sort((a, b) => order.indexOf(a.split("/")[0]) - order.indexOf(b.split("/")[0]) || a.localeCompare(b))
    .forEach(p => { const i = p.indexOf("/"); rows.push([p.slice(0, i), p.slice(i + 1), docSummary(p, docs[p]), JSON.stringify(docs[p])]); });
  if (await saveText(`futsal-backup-${stamp()}.csv`, toCSV(rows))) { ls.set("lastBackup", String(Date.now())); if (tab === "scorer") render(); }
}
async function restoreBackup(file) {
  if (!guard()) return;
  let rows;
  try { rows = parseCSV(await file.text()); } catch (e) { return toast("Couldn't read that file."); }
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
  const ci = head.indexOf("collection"), ii = head.indexOf("id"), di = head.indexOf("data");
  if (ci < 0 || ii < 0 || di < 0) return toast("That isn't a futsal backup. Use a file from Download backup.");
  const allowed = ["meta", "houses", "players", "matches", "events", "kicks"];
  const docs = {}; let bad = 0;
  rows.forEach(r => {
    const cn = (r[ci] || "").trim(), id = (r[ii] || "").trim();
    if (!allowed.includes(cn) || !/^[A-Za-z0-9_\-.~:@+]+$/.test(id)) { bad++; return; }
    try { const d = JSON.parse(r[di]); if (d && typeof d === "object" && !Array.isArray(d)) docs[cn + "/" + id] = d; else bad++; } catch (e) { bad++; }
  });
  const count = cn => Object.keys(docs).filter(k => k.startsWith(cn + "/")).length;
  if (!count("houses") || !count("matches")) return toast("That backup has no houses or fixtures, so it can't be restored.");
  const played = Object.entries(docs).filter(([k, d]) => k.startsWith("matches/") && d.status !== "scheduled").length;
  const ok = await confirmSheet("Restore this backup?",
    `${count("houses")} houses · ${count("players")} players · ${count("matches")} matches (${played} started) · ${count("events")} match events · ${count("kicks")} shootout kicks${bad ? `<br>${bad} unreadable rows skipped.` : ""}<br><br>This replaces everything currently saved${sheetMode ? " in the Google Sheet, for every device" : ""}. The PIN stays the same.`, "Replace with backup", true);
  if (!ok) return;
  if (S.config && S.config.pin && docs["meta/config"]) docs["meta/config"].pin = S.config.pin;
  toast("Restoring…");
  try {
    if (db.replaceAll) await db.replaceAll(docs);
    else {
      const cur = allDocs();
      const jobs = [...Object.keys(cur).filter(p => !docs[p]).map(p => () => db.doc(p).delete()), ...Object.keys(docs).map(p => () => db.doc(p).set(docs[p]))];
      for (let i = 0; i < jobs.length; i += 10) await Promise.all(jobs.slice(i, i + 10).map(f => f()));
    }
    toast(`Restored ${Object.keys(docs).length} records`);
  } catch (e) { toast(e && e.error === "bad_pin" ? "The sheet rejected the PIN. Unlock again and retry." : "Restore didn't finish. Check the connection and try again."); }
}
async function loadStarter() {
  if (!guard()) return;
  if (!(await confirmSheet("Load starter data?", "Sets up the 4 houses with placeholder players and all 13 fixtures. Anything currently saved is replaced.", "Load starter data", matchList().length > 0))) return;
  const docs = seedData();
  try {
    if (db.replaceAll) await db.replaceAll(docs);
    else { for (const p of Object.keys(allDocs())) await db.doc(p).delete(); for (const [p, d] of Object.entries(docs)) await db.doc(p).set(d); }
    toast("Starter data loaded");
  } catch (e) { toast("Couldn't load starter data. Check the connection and try again."); }
}

/* ---------- boot ---------- */
async function boot() {
  render();
  const inClaude = !!(window.claude && window.claude.use);
  const use = n => inClaude ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  db = await use("db");
  const api = String(window.FUTSAL_SHEET_API || "").trim();
  if (!db && !inClaude && api) {
    sheetMode = true; db = sheetDB(api); dl = localDownloads; canWrite = true;
  } else if (!db && !inClaude) {
    offline = true; db = localDB(); dl = localDownloads; canWrite = true;
    const n = $("#notice"); n.hidden = false;
    n.textContent = "Offline mode: this copy saves results in this browser on this device only. Other phones won't see them. Use the claude.ai link for live scoring on two courts, or export to Excel to keep a record.";
  } else if (!db) { render(); return; }
  if (!offline && !sheetMode) {
    [userCap, dl] = await Promise.all([use("user"), use("downloads")]);
    if (userCap) { try { canWrite = await userCap.can("data.write"); } catch (e) { canWrite = null; } }
  }
  const fail = err => { if (err && err.code === "unavailable") setTimeout(() => location.reload(), 4000); };
  db.doc("meta/config").onSnapshot(s => { S.config = s.exists ? s.data() : null; S.loaded.config = true; schedule(); }, fail);
  ["houses", "players", "matches", "events", "kicks"].forEach(cn => db.collection(cn).onSnapshot(q => {
    const o = {}; q.docs.forEach(d => { o[d.id] = { ...d.data(), id: d.id }; }); S[cn] = o; S.loaded[cn] = true; schedule();
  }, fail));
}
boot();
})();
