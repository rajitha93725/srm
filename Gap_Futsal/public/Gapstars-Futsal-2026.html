<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interhouse Futsal 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: scoreboard-first. Two court boards side by side, everything else is quiet tables beneath. */
:root{
  --bg:#eef2ee; --surface:#ffffff; --sunk:#e3e9e4; --ink:#13201a; --muted:#5b6b62; --line:#d3ddd6;
  --accent:#12704a; --accent-ink:#ffffff; --accent-soft:#d6ecdf;
  --live:#c9362b; --live-soft:#fbe3e0; --warn:#a46a00; --warn-soft:#fbefd4;
  --yellow:#e2b100; --red:#d0342c;
  --h-blue:#2a63c4; --h-gold:#a87a05; --h-red:#bf3a2e; --h-violet:#6d45bf; --h-teal:#0f7f86; --h-orange:#c45a12;
  --board:#0f1f18; --board-ink:#f4f8f5; --board-muted:#93a99c;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1410; --surface:#141f19; --sunk:#0f1813; --ink:#e6efe9; --muted:#93a59a; --line:#24342b;
  --accent:#3fbf80; --accent-ink:#06150d; --accent-soft:#163626;
  --live:#ff6a5c; --live-soft:#3a1714; --warn:#f0b43c; --warn-soft:#33270c;
  --yellow:#f5cb2e; --red:#ff5c52;
  --h-blue:#78a6ff; --h-gold:#e8bd4f; --h-red:#ff7d6e; --h-violet:#ad8cff; --h-teal:#4fc9cf; --h-orange:#ff9a55;
  --board:#07100b; --board-ink:#f4f8f5; --board-muted:#8aa294;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c1410; --surface:#141f19; --sunk:#0f1813; --ink:#e6efe9; --muted:#93a59a; --line:#24342b;
  --accent:#3fbf80; --accent-ink:#06150d; --accent-soft:#163626;
  --live:#ff6a5c; --live-soft:#3a1714; --warn:#f0b43c; --warn-soft:#33270c;
  --yellow:#f5cb2e; --red:#ff5c52;
  --h-blue:#78a6ff; --h-gold:#e8bd4f; --h-red:#ff7d6e; --h-violet:#ad8cff; --h-teal:#4fc9cf; --h-orange:#ff9a55;
  --board:#07100b; --board-ink:#f4f8f5; --board-muted:#8aa294;
  color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);margin:0}
#app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
.num,.score,.clock,table{font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-size:clamp(26px,4.4vw,38px);font-weight:800;text-transform:uppercase;line-height:1}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sync{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.sync.ok{background:var(--accent-soft);color:var(--accent)}
.sync.saving{background:var(--warn-soft);color:var(--warn)}
.sync.offline{background:var(--live-soft);color:var(--live)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.ghost{background:transparent}
.btn.big{min-height:52px;font-size:16px;padding:10px 18px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.notice{background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px}
.empty{color:var(--muted);padding:22px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.section-head h2{font-size:24px;text-transform:uppercase}

/* House chip */
.hc{display:inline-flex;align-items:center;gap:7px;font-weight:600;min-width:0}
.hc i{width:10px;height:10px;border-radius:2px;background:var(--hc);flex:none;transform:rotate(45deg)}
.hc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Court boards */
.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.board{background:var(--board);color:var(--board-ink);border-radius:14px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.board .bh{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--board-muted);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.board .bh b{color:var(--board-ink);font-family:var(--display);font-size:20px;letter-spacing:.06em}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:color-mix(in srgb,var(--board-ink) 12%,transparent);color:var(--board-ink)}
.pill.live{background:var(--live);color:#fff}
.pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.live::before{animation:none}}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.team{display:flex;flex-direction:column;gap:4px;min-width:0}
.team.away{align-items:flex-end;text-align:right}
.team .tn{font-family:var(--display);font-size:clamp(22px,3.4vw,30px);font-weight:700;text-transform:uppercase;line-height:1;color:var(--board-ink);overflow-wrap:anywhere}
.team .bar{height:4px;width:46px;border-radius:2px;background:var(--hc)}
.score{font-family:var(--display);font-weight:800;font-size:clamp(54px,9vw,84px);line-height:.9;letter-spacing:.02em;white-space:nowrap}
.score small{font-size:.32em;color:var(--board-muted);display:block;text-align:center;letter-spacing:.04em;margin-top:6px}
.clockrow{display:flex;justify-content:center;align-items:baseline;gap:10px}
.clock{font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:.04em;color:var(--board-ink)}
.clock.over{color:var(--yellow)}
.period{color:var(--board-muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.susp{display:flex;flex-direction:column;gap:6px}
.susp div{background:color-mix(in srgb,var(--red) 30%,var(--board));border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;border-top:1px solid color-mix(in srgb,var(--board-ink) 14%,transparent);padding-top:10px}
.timeline li{display:grid;grid-template-columns:38px 22px 1fr;gap:6px;align-items:center;font-size:14px;color:var(--board-ink)}
.timeline li.away{grid-template-columns:1fr 22px 38px;text-align:right}
.timeline li.away .mn{order:3}.timeline li.away .ic{order:2}.timeline li.away .tx{order:1}
.timeline .mn{color:var(--board-muted);font-weight:600}
.timeline .tx{min-width:0;overflow-wrap:anywhere}
.timeline .tx em{color:var(--board-muted);font-style:normal}
.ic{display:inline-grid;place-items:center;width:18px;height:18px}
.ic.ball::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid currentColor;box-sizing:border-box;background:radial-gradient(circle,currentColor 2.5px,transparent 3px)}
.ic.yc::before,.ic.rc::before{content:"";width:11px;height:15px;border-radius:2px;background:var(--yellow)}
.ic.rc::before{background:var(--red)}
.ic.save::before{content:"";width:14px;height:10px;border:2px solid currentColor;border-bottom:0;border-radius:6px 6px 0 0;box-sizing:border-box}
.ic.gk::before{content:"⇄";font-size:14px;font-weight:700}
.ic.sub::before{content:"⇅";font-size:15px;font-weight:700;color:var(--accent)}
.oncourt{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--board-muted)}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.pp{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--surface)}
.pp.gkp{border-color:var(--accent);background:var(--accent-soft)}
.plist.bench .pp{background:var(--sunk);color:var(--muted);font-weight:500}
.pp.off{border-color:var(--red);color:var(--red);text-decoration:line-through}
.lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:6px}
.lu{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:14px;cursor:pointer;min-width:0}
.lu span{min-width:0;overflow-wrap:anywhere}
.lu small{margin-left:auto;color:var(--muted)}
.lu:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.board .foot{color:var(--board-muted);font-size:13px}
.pens{display:flex;justify-content:center;gap:16px;align-items:center;font-size:14px;color:var(--board-muted)}
.dots{display:flex;gap:4px}
.dots b{width:12px;height:12px;border-radius:50%;border:2px solid var(--board-muted)}
.dots b.s{background:var(--accent);border-color:var(--accent)}
.dots b.m{background:var(--red);border-color:var(--red)}

/* Tables */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr.q td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
td .why{display:block;font-size:12px;color:var(--muted);font-weight:500;white-space:normal}
td.pts{font-weight:800;font-family:var(--display);font-size:19px}

/* Fixtures */
.round{display:flex;flex-direction:column;gap:6px}
.fx{display:grid;grid-template-columns:76px minmax(0,1fr) auto minmax(0,1fr) 82px;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.fx .c{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fx .h{justify-self:end;text-align:right}
.fx .sc{font-family:var(--display);font-weight:800;font-size:22px;min-width:70px;text-align:center}
.fx .st{justify-self:end;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fx .st.live{color:var(--live)}
.fx.final{border-color:var(--accent);background:var(--accent-soft)}
.fxnote{grid-column:1/-1;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:560px){.fx{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.fx .c,.fx .st{grid-column:span 3;justify-self:start}.fx .st{order:-1}}

/* Awards */
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.award h3{font-size:22px;text-transform:uppercase}
.leader{display:flex;flex-direction:column;gap:2px;padding:12px 0;border-bottom:1px solid var(--line)}
.leader .nm{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.05;overflow-wrap:anywhere}
.leader .big{font-family:var(--display);font-size:44px;font-weight:800;line-height:1;color:var(--accent)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rank li .n{color:var(--muted);font-weight:700}
.rank li .v{font-family:var(--display);font-weight:800;font-size:20px}
.rank li small{display:block;color:var(--muted);font-size:12px}

/* Squads */
.squads{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}

/* Scorer */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 16px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.console{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.tp{display:flex;flex-direction:column;gap:10px}
.tp .acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tp .acts .goal{grid-column:span 2;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-height:60px;font-size:18px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.evlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.evlist li{display:grid;grid-template-columns:40px 22px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.minbtn{border:1px dashed var(--line);background:none;border-radius:6px;padding:2px 4px;color:var(--muted);font-weight:600;font-size:13px}
.minbtn:hover{border-color:var(--accent);color:var(--accent)}
.x{border:0;background:none;color:var(--muted);font-size:18px;padding:4px 8px;border-radius:6px}
.x:hover{background:var(--sunk);color:var(--red)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=password],input[type=time],select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.prow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) 70px 64px 52px auto;gap:6px;align-items:center}
@media (max-width:640px){.prow{grid-template-columns:1fr 1fr}.prow .wide{grid-column:span 2}}
.pin{max-width:340px;margin:24px auto;display:flex;flex-direction:column;gap:12px;text-align:center}
.pin input{text-align:center;font-size:28px;letter-spacing:.4em;font-family:var(--display)}

/* Sheet (modal) */
.sheet{position:fixed;inset:0;background:color-mix(in srgb,#000 50%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.sheet-card{background:var(--surface);color:var(--ink);border-radius:14px;width:min(520px,100%);max-height:85vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{align-items:center}}
.pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick button{min-height:54px;text-align:left;justify-content:flex-start}
.pick button small{color:var(--muted);font-weight:500;margin-left:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}

/* TV mode */
body.tv #app{max-width:none;padding-block:14px}
body.tv .tabs,body.tv .top-actions .hide-tv{display:none}
.tvgrid{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.tvgrid{grid-template-columns:1fr}}
body.tv .score{font-size:clamp(70px,9vw,140px)}
body.tv .clock{font-size:clamp(34px,4vw,60px)}
body.tv .team .tn{font-size:clamp(26px,3vw,46px)}
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1 id="ttl">Interhouse Futsal 2026</h1>
      <p id="sub">Champ Turf · Friday 9 October 2026</p>
    </div>
    <div class="top-actions">
      <span class="sync" id="sync" hidden></span>
      <button class="btn hide-tv" id="exportBtn" type="button">Export CSV</button>
      <button class="btn" id="tvBtn" type="button">TV mode</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="notice" id="notice" hidden></div>
  <main id="view"><div class="empty">Loading the tournament…</div></main>
</div>
<div class="sheet" id="sheet" hidden><div class="sheet-card" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ============================================================
   GOOGLE SHEET CONNECTION (for your own hosting)
   Paste your Apps Script Web app URL (ends in /exec) between the quotes.
   Leave it empty to run on one device only.
   ============================================================ */
window.FUTSAL_SHEET_API = window.FUTSAL_SHEET_API || "https://script.google.com/macros/s/AKfycbyc5gEkK4PHV_eT6O026DoDuoxOrZ-8FNBlTwUQQxiJQQUeIZ9wqDpD2wqBq1JC96s_6A/exec";

/* ---------- Tournament logic (pure, no DOM) ---------- */
const L = (() => {
  const DEFAULTS = {
    title: "Interhouse Futsal 2026",
    venue: "Champ Turf",
    date: "Friday 9 October 2026",
    courts: ["Court A", "Court B"],
    pin: "2026",
    durations: { league: { half: 7, brk: 1 }, final: { half: 10, brk: 2 } },
    weights: { goal: 3, assist: 2, save: 1, cleanSheet: 3, win: 1, yellow: -1, red: -3 },
    gkWeights: { save: 1, cleanSheet: 3, conceded: -1, shootoutSave: 2 }
  };

  function cfg(raw) {
    const c = Object.assign({}, DEFAULTS, raw || {});
    c.durations = {
      league: Object.assign({}, DEFAULTS.durations.league, (raw && raw.durations && raw.durations.league) || {}),
      final: Object.assign({}, DEFAULTS.durations.final, (raw && raw.durations && raw.durations.final) || {})
    };
    c.weights = Object.assign({}, DEFAULTS.weights, (raw && raw.weights) || {});
    c.gkWeights = Object.assign({}, DEFAULTS.gkWeights, (raw && raw.gkWeights) || {});
    c.courts = (raw && Array.isArray(raw.courts) && raw.courts.length) ? raw.courts : DEFAULTS.courts;
    return c;
  }

  const halfMs = (m, c) => (m && m.stage === "final" ? c.durations.final.half : c.durations.league.half) * 60000;

  function clockMs(m, now) {
    if (!m) return 0;
    let e = Number(m.elapsedMs) || 0;
    if (m.running && m.startedAt) e += now - m.startedAt;
    return Math.max(0, e);
  }

  const totalTime = (m, period, ms, c) => (period - 1) * halfMs(m, c) + ms;

  function minuteOf(e, m, c) {
    const half = halfMs(m, c) / 60000;
    const ms = Math.min(e.clockMs || 0, halfMs(m, c) - 1);
    return Math.floor(ms / 60000) + 1 + (e.period === 2 ? half : 0);
  }

  const byTs = (a, b) => (a.ts || 0) - (b.ts || 0);
  const matchEvents = (S, mid) => Object.values(S.events).filter(e => e.matchId === mid).sort(byTs);
  const matchKicks = (S, mid) => Object.values(S.kicks).filter(k => k.matchId === mid).sort(byTs);
  const other = (m, hid) => (hid === m.homeId ? m.awayId : m.homeId);
  const housePlayers = (S, hid) => Object.values(S.players).filter(p => p.houseId === hid)

  $("#tabs").innerHTML = TABS.map(([k, v]) => `<button role="tab" type="button" data-tab="${k}" aria-selected="${k === tab}">${v}</button>`).join("");
  $("#tvBtn").textContent = tv ? "Exit TV mode" : "TV mode";
  const ready = S.loaded.matches && S.loaded.houses;
  let html;
  if (!db) html = `<div class="empty">The scoreboard needs live data. Open this page signed in to claude.ai.</div>`;
  else if (!ready) html = `<div class="empty">Loading the tournament…</div>`;
  else if (!matchList().length && tab !== "scorer") html = `<div class="empty">No fixtures yet. Open the Scorer tab, unlock it, and use Setup to load starter data or restore a backup.</div>`;
  else if (tv) html = viewTV();
  else html = ({ live: viewLive, fixtures: viewFixtures, table: viewTable, awards: viewAwards, squads: viewSquads, scorer: viewScorer })[tab]();
  const keep = {};
  document.querySelectorAll("#view input[id], #view select[id]").forEach(el => {
    if (["matchSel", "kicker", "keeper", "pinIn", "importFile"].includes(el.id)) return;
    keep[el.id] = el.type === "checkbox" ? el.checked : el.value;
  });
  $("#view").innerHTML = html;
  Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if (!el) return; if (el.type === "checkbox") el.checked = v; else el.value = v; });
  tick();
}

/* ---------- live boards ---------- */
function finalTeams(m) {
  if (m.stage !== "final" || m.homeId) return { h: m.homeId, a: m.awayId, provisional: false };
  const st = L.standings(S), done = L.leagueComplete(S);
  const played = L.leagueMatches(S).filter(x => x.status === "finished").length;
  const tied = !!(st[1] && st[1].reason && st[1].reason.tied);
  return { h: done ? st[0] && st[0].id : null, a: done ? st[1] && st[1].id : null, provisional: true, done, played,
    lead: played ? [st[0] && st[0].id, st[1] && st[1].id] : null, tied };
}
function finalNote(ft) {
  if (!ft.provisional) return "";
  if (ft.done) return ft.tied ? "2nd and 3rd are level on every criterion. Settle it with a penalty shootout and set the rank in Setup." : "League complete. Table toppers confirmed.";
  return `1st v 2nd in the league table · ${ft.played} of 12 league matches played${ft.lead ? ` · currently ${esc(hname(ft.lead[0]))} and ${esc(hname(ft.lead[1]))}` : ""}`;
}
function onCourt(m, hid) {
  if (!hid || !["live", "halftime", "shootout"].includes(m.status)) return "";
  const lu = L.lineupState(S, m)[hid]; if (!lu || !lu.hasLineup) return "";
  return `<span class="oncourt">${lu.men}${lu.women ? " + " + lu.women + "W" : ""} on court${lu.short ? " · a player short" : ""}</span>`;
}
function stageLabel(m) { return m.stage === "final" ? "Final" : `Match ${m.no} · Round ${m.round}`; }
function statusPill(m) {
  if (m.status === "live") return `<span class="pill live">Live</span>`;
  if (m.status === "halftime") return `<span class="pill">Half-time</span>`;
  if (m.status === "shootout") return `<span class="pill live">Penalties</span>`;
  if (m.status === "finished") return `<span class="pill">Full time</span>`;
  return `<span class="pill">Up next${m.time ? " · " + esc(m.time) : ""}</span>`;
}
function evText(e, m) {
  if (e.type === "goal") return e.ownGoal ? `Own goal${e.playerId ? ` <em>${esc(pname(e.playerId))}</em>` : ""}` : `${esc(pname(e.playerId))}${e.assistId ? ` <em>· assist ${esc(pname(e.assistId))}</em>` : ""}`;
  if (e.type === "save") return `Save · ${esc(pname(e.playerId))}`;
  if (e.type === "yellow") return `${esc(pname(e.playerId))} <em>yellow card</em>`;
  if (e.type === "red") return `${esc(pname(e.playerId))} <em>${e.auto ? "second yellow, sent off" : "red card"}</em>`;
  if (e.type === "gk") return `${esc(pname(e.playerId))} <em>in goal</em>`;
  if (e.type === "sub") return e.outId ? `${esc(pname(e.playerId))} on <em>· ${esc(pname(e.outId))} off</em>` : `${esc(pname(e.playerId))} on <em>· back to full strength</em>`;
  return "";
}
const evIcon = e => ({ goal: "ball", save: "save", yellow: "yc", red: "rc", gk: "gk", sub: "sub" }[e.type] || "");
function pensBlock(m) {
  const so = L.shootout(S, m);
  if (!so.kicks.length && m.status !== "shootout") return "";
  const dots = hid => so.kicks.filter(k => k.houseId === hid).map(k => `<b class="${k.result === "scored" ? "s" : "m"}"></b>`).join("") || `<span>–</span>`;
  return `<div class="pens"><div class="dots">${dots(m.homeId)}</div><b class="score" style="font-size:26px;color:var(--board-ink)">${so.tally[m.homeId] ? so.tally[m.homeId].g : 0}–${so.tally[m.awayId] ? so.tally[m.awayId].g : 0}</b><div class="dots">${dots(m.awayId)}</div></div>
    <div class="foot" style="text-align:center">${so.winner ? `${esc(hname(so.winner))} win on penalties` : `Penalties${so.suddenDeath ? " · sudden death" : ""} · ${esc(hname(so.next))} to kick`}</div>`;
}
function board(ci) {
  const c = C(), m = L.courtMatch(S, ci);
  const cn = esc(c.courts[ci] || "Court " + (ci + 1));
  if (!m) return `<article class="board"><div class="bh"><b>${cn}</b></div><p class="foot">No matches on this court.</p></article>`;
  const ft = finalTeams(m), s = L.started(m) ? L.score(S, m) : null;
  const ev = L.matchEvents(S, m.id).filter(e => e.type !== "save").slice(-8).reverse();
  return `<article class="board">
    <div class="bh"><b>${cn}</b><span>${stageLabel(m)}</span>${statusPill(m)}</div>
    <div class="scoreline">
      <div class="team" style="--hc:${hcolor(ft.h)}"><span class="bar"></span><span class="tn">${esc(ft.h ? hname(ft.h) : "1st place")}</span>${onCourt(m, ft.h)}</div>
      <div class="score">${s ? `${s.h}<span style="color:var(--board-muted)">–</span>${s.a}` : `<span style="color:var(--board-muted)">vs</span>`}</div>
      <div class="team away" style="--hc:${hcolor(ft.a)}"><span class="bar"></span><span class="tn">${esc(ft.a ? hname(ft.a) : "2nd place")}</span>${onCourt(m, ft.a)}</div>
    </div>
    ${["live", "halftime"].includes(m.status) ? `<div class="clockrow"><span class="clock" data-clock="${m.id}">--:--</span><span class="period">${m.status === "halftime" ? "Half-time" : (m.period === 2 ? "2nd half" : "1st half")}${m.running ? "" : (m.status === "live" ? " · paused" : "")}</span></div><div class="susp" data-susp="${m.id}"></div>` : ""}
    ${ft.provisional ? `<p class="foot" style="text-align:center">${finalNote(ft)}</p>` : ""}
    ${m.stage === "final" ? pensBlock(m) : ""}
    ${ev.length ? `<ul class="timeline">${ev.map(e => `<li class="${e.houseId === m.awayId ? "away" : ""}"><span class="mn">${L.minuteOf(e, m, c)}′</span><span class="ic ${evIcon(e)}"></span><span class="tx">${evText(e, m)}</span></li>`).join("")}</ul>` : ""}
  </article>`;
}
function upNext() {
  const c = C();
  const nxt = matchList().filter(m => m.status === "scheduled").slice(0, 4);
  if (!nxt.length) return "";
  return `<section class="stack"><div class="section-head"><h2>Coming up</h2></div><div class="round">${nxt.map(fxRow).join("")}</div></section>`;
}
function viewLive() {
  const c = C();
  return `<section class="courts">${c.courts.map((_, i) => board(i)).join("")}</section>${upNext()}`;
}
function viewTV() {
  const c = C(), st = L.standings(S), aw = L.awards(S, c);
  const top = aw.scorers.slice(0, 5);
  return `<div class="tvgrid"><section class="courts" style="grid-template-columns:1fr">${c.courts.map((_, i) => board(i)).join("")}</section>
    <aside class="stack">
      <div class="panel"><div class="section-head"><h2>Standings</h2></div><div class="tw">${tableHTML(st, true)}</div></div>
      <div class="panel"><div class="section-head"><h2>Top scorers</h2></div>${top.length ? `<ol class="rank">${top.map((p, i) => `<li><span class="n">${i + 1}</span><span>${esc(p.name)}<small>${esc(hname(p.houseId))}</small></span><span class="v">${p.goals}</span></li>`).join("")}</ol>` : `<p class="muted">No goals yet.</p>`}</div>
    </aside></div>`;
}

/* ---------- fixtures ---------- */
function fxRow(m) {
  const c = C(), ft = finalTeams(m);
  let sc = `<span class="muted">vs</span>`;
  if (L.started(m)) { const r = L.result(S, m), ht = L.halfTime(S, m); sc = `${r.h}–${r.a}${r.pens ? `<small class="muted" style="display:block;font-size:12px;font-family:var(--body)">${r.pens.tally[m.homeId].g}–${r.pens.tally[m.awayId].g} pens</small>` : ""}${ht ? `<small class="muted" style="display:block;font-size:12px;font-family:var(--body);font-weight:500">HT ${ht.h}–${ht.a}</small>` : ""}`; }
  const st = { live: "Live", halftime: "Half-time", shootout: "Penalties", finished: "Full time", scheduled: m.time ? esc(m.time) : "Scheduled" }[m.status] || "";
  return `<div class="fx ${m.stage === "final" ? "final" : ""}"><span class="c">${esc(c.courts[m.court || 0] || "")}</span>
    <span class="h">${ft.h ? chip(ft.h) : `<span class="muted">1st place</span>`}</span><span class="sc">${sc}</span>
    <span>${ft.a ? chip(ft.a) : `<span class="muted">2nd place</span>`}</span><span class="st ${["live", "shootout"].includes(m.status) ? "live" : ""}">${st}</span>
    ${ft.provisional ? `<span class="fxnote">${finalNote(ft)}</span>` : ""}</div>`;
}
function viewFixtures() {
  const ms = matchList(), rounds = {};
  ms.forEach(m => { const k = m.stage === "final" ? "Final" : "Round " + m.round; (rounds[k] = rounds[k] || []).push(m); });
  const c = C();
  return `<section class="stack"><div class="section-head"><h2>Fixtures & results</h2><span class="muted">League ${c.durations.league.half}′ + ${c.durations.league.half}′ · Final ${c.durations.final.half}′ + ${c.durations.final.half}′</span></div>
    ${Object.entries(rounds).map(([k, list]) => `<div class="round"><span class="label">${esc(k)}</span>${list.map(fxRow).join("")}</div>`).join("")}</section>`;
}

/* ---------- standings ---------- */
function tableHTML(st, compact) {
  return `<table><thead><tr><th class="l">#</th><th class="l">House</th><th>P</th><th>W</th><th>D</th><th>L</th>${compact ? "" : "<th>GF</th><th>GA</th>"}<th>GD</th><th>Pts</th></tr></thead><tbody>
    ${st.map(r => `<tr class="${r.pos <= 2 ? "q" : ""}"><td class="l num">${r.pos}</td><td class="l">${chip(r.id)}${!compact && r.reason && r.reason.by !== "Points" ? `<span class="why">${r.reason.tied ? "Level with the house below. Set the shootout order in Setup." : "Ahead of the house below on " + r.reason.by.toLowerCase()}</span>` : ""}</td>
    <td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td>${compact ? "" : `<td>${r.GF}</td><td>${r.GA}</td>`}<td>${r.GD > 0 ? "+" : ""}${r.GD}</td><td class="pts">${r.Pts}</td></tr>`).join("")}</tbody></table>`;
}
function viewTable() {
  const st = L.standings(S), lm = L.leagueMatches(S), done = lm.filter(m => m.status === "finished").length;
  return `<section class="stack"><div class="section-head"><h2>League standings</h2><span class="muted">${done} of ${lm.length} league matches played</span></div>
    <div class="panel"><div class="tw">${tableHTML(st, false)}</div></div>
    <p class="muted" style="margin:0;font-size:14px">The top two houses (green edge) meet in the Final. Ranking follows Law 6: points, then goal difference, goals scored, wins, head-to-head, and finally a penalty shootout. Only goals in match time count; shootout goals never do.</p></section>`;
}

/* ---------- awards ---------- */
function viewAwards() {
  const c = C(), aw = L.awards(S, c), w = c.weights, g = c.gkWeights;
  const block = (title, list, val, sub, rule) => {
    const lead = list[0];
    return `<div class="panel award stack"><h3>${title}</h3>
      ${lead ? `<div class="leader"><span class="label">Leading</span><span class="nm">${esc(lead.name)}</span><span class="row">${chip(lead.houseId)}</span><span class="big num">${val(lead)}</span><span class="muted" style="font-size:13px">${sub(lead)}</span></div>
      <ol class="rank">${list.slice(1, 6).map((p, i) => `<li><span class="n">${i + 2}</span><span>${esc(p.name)}<small>${esc(hname(p.houseId))} · ${sub(p)}</small></span><span class="v num">${val(p)}</span></li>`).join("")}</ol>` : `<p class="muted">Nothing recorded yet.</p>`}
      <p class="muted" style="font-size:13px;margin:0">${rule}</p></div>`;
  };
  return `<section class="stack"><div class="section-head"><h2>Award races</h2><span class="muted">Updates as each event is logged</span></div><div class="awards">
    ${block("Top goal scorer", aw.scorers, p => p.goals, p => `${p.assists} assists`, "Goals in match time only. Own goals and shootout kicks don't count. Ties go to more assists, then fewer cards.")}
    ${block("Best goalkeeper", aw.keepers, p => p.gkPts, p => `${p.saves} saves · ${p.gkCs} clean sheets · ${p.conceded} conceded`, `Points: save ${sg(g.save)}, clean sheet ${sg(g.cleanSheet)}, goal conceded ${sg(g.conceded)}, shootout save ${sg(g.shootoutSave)}. Goals count against whoever was in goal at the time.`)}
    ${block("Best player", aw.best, p => p.best, p => `${p.goals}G ${p.assists}A${p.saves ? ` ${p.saves}Sv` : ""}${p.cs ? ` ${p.cs}CS` : ""} · ${p.wins}W${p.yellow ? ` ${p.yellow}YC` : ""}${p.red ? ` ${p.red}RC` : ""}`, `Points: goal ${sg(w.goal)}, assist ${sg(w.assist)}, save ${sg(w.save)}, clean sheet ${sg(w.cleanSheet)}, win ${sg(w.win)}, yellow ${sg(w.yellow)}, red ${sg(w.red)}.`)}
    ${block("Top assists", aw.assists, p => p.assists, p => `${p.goals} goals`, "Assists in match time. Ties go to more goals.")}
    ${champCard()}

function champion() {

  return `<div class="panel award stack"><h3>Champion house</h3>${ch ? `<div class="leader"><span class="label">Winner of the Final</span><span class="nm">${chip(ch.id)}</span>
    <span class="muted" style="font-size:13px">${esc(hname(ch.f.homeId))} ${ch.r.h}–${ch.r.a} ${esc(hname(ch.f.awayId))}${ch.r.pens ? ` · ${ch.r.pens.tally[ch.f.homeId].g}–${ch.r.pens.tally[ch.f.awayId].g} on penalties` : ""}</span></div>`
    : `<p class="muted">Decided by the Final${ft.h && ft.a ? `: ${esc(hname(ft.h))} v ${esc(hname(ft.a))}` : ", once the top two are known"}.</p>`}</div>`;

const sg = n => (n > 0 ? "+" : "") + n;

/* ---------- squads ---------- */

/* ---------- scorer ---------- */
function viewScorer() {
  const c = C();
  if (!matchList().length) scorerView = "setup";
  if (!unlocked) return `<form class="pin panel" id="pinForm"><h2>Scorer access</h2><p class="muted" style="margin:0">Enter the scorer PIN to log goals, cards and results.</p>

  const warn = (canWrite === false || readOnly) ? `<div class="notice">Your account can view this page but can't save changes. Ask the organiser to invite you as an Editor, or score from the organiser's account.</div>` : "";
  return `<section class="stack">${warn}
    <div class="row" style="justify-content:space-between"><div class="seg" role="group" aria-label="Scorer area">

function consoleMatch() {
  const id = selMatch[court];
  if (id && S.matches[id] && (S.matches[id].court || 0) === court) return S.matches[id];
  return L.courtMatch(S, court);
}
function consoleView() {

}
function matchConsole(m) {

  const ft = finalTeams(m);
  const scoreboard = miniBoard(m);
  if (m.status === "scheduled") {
    if (!ft.h || !ft.a) return scoreboard + `<div class="empty">The Final is between the top two in the league table. It unlocks when all 12 league matches are finished (${ft.played} of 12 so far)${ft.lead ? `. Currently ${esc(hname(ft.lead[0]))} and ${esc(hname(ft.lead[1]))}` : ""}.</div>`;
    const sel = hid => { const start = new Set(L.defaultLineup(S, hid)); return `<div class="panel stack" style="background:var(--sunk)"><div class="section-head"><span>${chip(hid)}</span><span class="muted" style="font-size:13px">Tick the starting players</span></div>
      <div class="lineup">${L.housePlayers(S, hid).map(p => `<label class="lu"><input type="checkbox" id="lu_${hid}_${p.id}" data-lu="${hid}" value="${p.id}" ${start.has(p.id) ? "checked" : ""}><span>${esc(p.name)}</span><small>${p.gender === "F" ? "W" : ""}${p.number ? " #" + esc(p.number) : ""}</small></label>`).join("")}</div>
      <div class="field"><label for="gk_${hid}">Goalkeeper</label><select id="gk_${hid}">${L.housePlayers(S, hid).map(p => `<option value="${p.id}" ${p.id === L.defaultKeeper(S, hid) ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div></div>`; };
    return scoreboard + `<div class="panel stack"><h3>Before kick-off</h3>
      ${ft.provisional ? `<div class="notice">Final: ${esc(hname(ft.h))} (1st) v ${esc(hname(ft.a))} (2nd). ${ft.tied ? "2nd and 3rd are level on every criterion. Settle it with a shootout and set the rank in Setup before kicking off." : "Kicking off locks these two in."}</div>` : ""}
      <p class="muted" style="margin:0;font-size:14px">Law 1: 5 men on court, one in goal, plus an optional 6th spot for a woman player. If only one team fields a woman, the match is 6 v 5. Unticked players start on the bench.</p>
      <div class="console">${sel(ft.h)}${sel(ft.a)}</div>
      <div class="grid2"><div class="field"><label for="mtime">Kick-off time</label><input type="time" id="mtime" value="${esc(m.time || "")}"></div>
        <div class="field"><label for="mref">Referee</label><input type="text" id="mref" value="${esc(m.referee || "")}" placeholder="Name"></div>
        <div class="field"><label for="mscorer">Scorer</label><input type="text" id="mscorer" value="${esc(m.scorer || ls.get("scorerName") || "")}" placeholder="Your name"></div></div>
      <button class="btn primary big" type="button" data-act="kickoff" data-m="${m.id}">Kick off · start ${c.durations[m.stage === "final" ? "final" : "league"].half}′ clock</button></div>`;
  }
  const evs = L.matchEvents(S, m.id).slice().reverse();
  const evList = evs.length ? `<ul class="evlist">${evs.map(e => `<li><button class="minbtn" type="button" title="Change the minute" data-act="editmin" data-e="${e.id}">${L.minuteOf(e, m, c)}′</button><span class="ic ${evIcon(e)}"></span><span>${chip(e.houseId)} ${evText(e, m)}</span><button class="x" type="button" title="Delete this event" aria-label="Delete event" data-act="delev" data-e="${e.id}">×</button></li>`).join("")}</ul>` : `<p class="muted">No events yet.</p>`;
  let controls = "";
  if (m.status === "live") controls = `<div class="ctrl">${m.running ? `<button class="btn big" type="button" data-act="pause" data-m="${m.id}">Pause clock</button>` : `<button class="btn primary big" type="button" data-act="resume" data-m="${m.id}">Resume clock</button>`}
      ${m.period === 1 ? `<button class="btn big" type="button" data-act="endhalf" data-m="${m.id}">End 1st half</button>` : `<button class="btn big" type="button" data-act="fulltime" data-m="${m.id}">Full time</button>`}
      <button class="btn big" type="button" data-act="adjust" data-m="${m.id}">Set clock</button></div>`;
  if (m.status === "halftime") controls = `<div class="ctrl"><button class="btn primary big" type="button" data-act="start2" data-m="${m.id}">Start 2nd half</button></div>`;
  if (m.status === "finished") controls = `<div class="ctrl"><span class="muted">Result saved.</span><button class="btn" type="button" data-act="reopen" data-m="${m.id}">Reopen match</button></div>`;
  const kt = L.keeperTimeline(S, m), lus = L.lineupState(S, m);
  const susp = L.suspensions(S, m, now(), c);
  const plist = (ids, hid) => ids.map(id => `<span class="pp${id === kt.current[hid] ? " gkp" : ""}">${esc(pname(id))}${id === kt.current[hid] ? " · GK" : ""}${P(id) && P(id).gender === "F" ? " · W" : ""}</span>`).join("") || `<span class="muted">Nobody</span>`;
  const teamPanel = hid => { const lu = lus[hid]; const waiting = susp.some(x => x.houseId === hid); return `<div class="panel tp"><div class="section-head"><h3 style="font-size:22px;text-transform:uppercase">${chip(hid)}</h3><span class="muted" style="font-size:13px">${lu.men}${lu.women ? " + " + lu.women + "W" : ""} on court</span></div>

    ${lu.sentOff.size ? `<span class="label">Sent off</span><div class="plist">${[...lu.sentOff].map(id => `<span class="pp off">${esc(pname(id))}</span>`).join("")}</div>` : ""}</div>
    ${lu.short ? `<div class="notice" style="font-size:14px">${waiting ? "A player short. The replacement can come on when the 1-minute suspension ends, or as soon as the opponent scores." : "Suspension over. Bring on a replacement to return to full strength."}</div>` : ""}

    <button class="btn primary" type="button" data-act="sub" data-h="${hid}" data-m="${m.id}" style="grid-column:span 2">Substitution</button>
    <button class="btn" type="button" data-act="save" data-h="${hid}" data-m="${m.id}">Save</button>
    <button class="btn" type="button" data-act="gkchange" data-h="${hid}" data-m="${m.id}">Swap GK on court</button>
    <button class="btn" type="button" data-act="yellow" data-h="${hid}" data-m="${m.id}"><span class="ic yc"></span>Yellow</button>

    <button class="btn" type="button" data-act="owngoal" data-h="${hid}" data-m="${m.id}" style="grid-column:span 2">Own goal for ${esc(hname(hid))}</button></div></div>`; };
  const shoot = m.status === "shootout" ? shootPanel(m) : "";

  return scoreboard + controls + shoot + (canLog ? `<div class="console">${teamPanel(m.homeId)}${teamPanel(m.awayId)}</div>` : "") +
    `<div class="panel stack"><div class="section-head"><h3>Match log</h3>${evs.length ? `<button class="btn" type="button" data-act="undo" data-m="${m.id}">Undo last event</button>` : ""}</div>${evList}</div>`;

function shootPanel(m) {
  const so = L.shootout(S, m);

  const kickList = so.kicks.map((k, i) => `<li><span class="muted">${i + 1}</span><span class="ic ${k.result === "scored" ? "ball" : "rc"}"></span><span>${chip(k.houseId)} ${esc(pname(k.kickerId))} <span class="muted">${k.result}</span></span><span></span></li>`).join("");
  if (so.winner) return `<div class="panel stack"><h3>${esc(hname(so.winner))} win the shootout ${so.tally[so.winner].g}–${so.tally[L.other(m, so.winner)].g}</h3>

    <div class="field"><label for="keeper">${esc(hname(opp))} in goal</label><select id="keeper">${L.housePlayers(S, opp).map(p => `<option value="${p.id}" ${p.id === kt.current[opp] ? "selected" : ""}>${esc(p.name)}${p.gender === "F" ? " (W)" : ""}</option>`).join("")}</select></div></div>
    <p class="muted" style="margin:0;font-size:13px">Law 6.4: one of each team's first three kicks is taken by the woman player. When she kicks, the other team's woman player keeps goal. Everyone kicks once before anyone kicks twice.</p>
    <div class="row"><button class="btn primary big" type="button" data-act="kick" data-r="scored" data-h="${hid}" data-m="${m.id}">Scored</button>
    <button class="btn big" type="button" data-act="kick" data-r="saved" data-h="${hid}" data-m="${m.id}">Saved</button>
    <button class="btn big" type="button" data-act="kick" data-r="missed" data-h="${hid}" data-m="${m.id}">Missed</button>
    ${so.kicks.length ? `<button class="btn ghost" type="button" data-act="undokick" data-m="${m.id}">Undo last kick</button>` : ""}</div>
    ${kickList ? `<ul class="evlist">${kickList}</ul>` : ""}</div>`;
}

/* ---------- clock tick ---------- */
function tick() {
  const c = C(), now = Date.now();
  document.querySelectorAll("[data-clock]").forEach(el => {
    const m = S.matches[el.getAttribute("data-clock")]; if (!m) return;
    const half = L.halfMs(m, c), e = Math.min(L.clockMs(m, now), half);
    el.textContent = m.status === "halftime" ? "00:00" : L.fmtClock(half - e);
    el.classList.toggle("over", m.status === "live" && e >= half);
  });
  document.querySelectorAll("[data-susp]").forEach(el => {
    const m = S.matches[el.getAttribute("data-susp")]; if (!m) return;
    const html = L.suspensions(S, m, now, c).map(s => `<div>${esc(hname(s.houseId))} a player short · ${esc(pname(s.playerId))} sent off · sub allowed in ${L.fmtClock(s.left)}</div>`).join("");
    if (el.innerHTML !== html) el.innerHTML = html;
  });
}
setInterval(tick, 250);

/* ---------- actions ---------- */
const now = () => Date.now();
function evBase(m) { const c = C(); return { matchId: m.id, period: m.period || 1, clockMs: Math.min(L.clockMs(m, now()), L.halfMs(m, c)), ts: now() }; }
async function act(a, d) {
  const m = d.m ? S.matches[d.m] : null;
  switch (a) {
    case "sv": scorerView = d.v; return render();
    case "lock": unlocked = false; ls.set("unlocked", "0"); return render();
    case "court": court = Number(d.v); ls.set("court", court); return render();
  }
  if (!guard()) return;
  const c = C();
  switch (a) {
    case "kickoff": {
      const ft = finalTeams(m);
      const gk = {}, lineup = {}, issues = [];
      [ft.h, ft.a].forEach(h => {
        const el = $("#gk_" + h); gk[h] = el ? el.value : L.defaultKeeper(S, h);
        const ticked = [...document.querySelectorAll(`[data-lu="${h}"]`)].filter(x => x.checked).map(x => x.value);
        lineup[h] = ticked.length ? ticked : L.defaultLineup(S, h);
        if (!lineup[h].includes(gk[h])) lineup[h].unshift(gk[h]);
        const men = lineup[h].filter(id => P(id) && P(id).gender !== "F").length, women = lineup[h].length - men;
        if (men > 5) issues.push(`${hname(h)} has ${men} men ticked (max 5).`);
        if (women > 1) issues.push(`${hname(h)} has ${women} women ticked (max 1).`);
        if (men < 5) issues.push(`${hname(h)} has only ${men} men ticked.`);
      });
      if (issues.some(x => /max/.test(x))) return toast(issues.find(x => /max/.test(x)));
      if (issues.length && !(await confirmSheet("Kick off anyway?", issues.map(esc).join("<br>"), "Kick off"))) return;
      const t = $("#mtime");
      await updD("matches", m.id, { homeId: ft.h, awayId: ft.a, status: "live", period: 1, running: true, startedAt: now(), elapsedMs: 0, gk, lineup, time: t ? t.value : (m.time || ""), referee: ($("#mref") || {}).value || "", scorer: ($("#mscorer") || {}).value || "" });
      if ($("#mscorer") && $("#mscorer").value) ls.set("scorerName", $("#mscorer").value);
      return toast("Kick-off. Clock running.");
    }
    case "pause": return updD("matches", m.id, { running: false, elapsedMs: L.clockMs(m, now()), startedAt: null });
    case "resume": return updD("matches", m.id, { running: true, startedAt: now() });
    case "endhalf": {
      if (!(await confirmSheet("End the 1st half?", "The clock stops for the half-time break.", "End half"))) return;
      return updD("matches", m.id, { status: "halftime", running: false, elapsedMs: L.clockMs(m, now()), startedAt: null });
    }
    case "start2": return updD("matches", m.id, { status: "live", period: 2, running: true, startedAt: now(), elapsedMs: 0 });
    case "fulltime": {
      const s = L.score(S, m);
      const draw = s.h === s.a, isFinal = m.stage === "final";
      if (!(await confirmSheet("Blow full time?", `Final score ${esc(hname(m.homeId))} ${s.h}–${s.a} ${esc(hname(m.awayId))}.${draw && isFinal ? " It's level, so the Final goes to kicks from the penalty mark." : ""}`, draw && isFinal ? "Go to penalties" : "Save result"))) return;
      await updD("matches", m.id, { status: draw && isFinal ? "shootout" : "finished", running: false, elapsedMs: L.clockMs(m, now()), startedAt: null });
      return toast(draw && isFinal ? "Penalties." : "Result saved. Standings updated.");
    }
    case "reopen": {
      if (!(await confirmSheet("Reopen this match?", "It goes back to live with the clock paused, so you can fix events. Standings drop it until you blow full time again.", "Reopen"))) return;
      return updD("matches", m.id, { status: "live", running: false });
    }
    case "goal": {
      const base = evBase(m);
      const pid = await pickPlayer(`Goal for ${hname(d.h)} · who scored?`, d.h, { groups: courtGroups(m, d.h, false) }); if (pid === undefined) return;
      const aid = await pickPlayer("Assist?", d.h, { allowNone: true, exclude: pid, groups: courtGroups(m, d.h, false) }); if (aid === undefined) return;
      await addD("events", { ...base, type: "goal", houseId: d.h, playerId: pid, assistId: aid || null, ownGoal: false });
      return toast(`Goal · ${pname(pid)}`);
    }
    case "owngoal": {
      const opp = L.other(m, d.h);
      const base = evBase(m);
      const pid = await pickPlayer(`Own goal by a ${hname(opp)} player`, opp, { allowNone: true, noneLabel: "Not sure who", groups: courtGroups(m, opp, false) }); if (pid === undefined) return;
      await addD("events", { ...base, type: "goal", houseId: d.h, playerId: pid || null, assistId: null, ownGoal: true });
      return toast(`Own goal · goal to ${hname(d.h)}`);
    }
    case "save": {
      const k = L.keeperTimeline(S, m).current[d.h] || await pickPlayer("Who made the save?", d.h); if (!k) return;
      await addD("events", { ...evBase(m), type: "save", houseId: d.h, playerId: k });
      return toast(`Save · ${pname(k)}`);
    }
    case "sub": {
      const base = evBase(m);
      const lu = L.lineupState(S, m)[d.h], kt = L.keeperTimeline(S, m);
      const waiting = L.suspensions(S, m, now(), c).some(x => x.houseId === d.h);
      const extra = lu.short ? `<button class="btn ghost" type="button" data-v="__short">Nobody · replacing a sent-off player${waiting ? " (suspension still running)" : ""}</button>` : "";
      const out = await pickPlayer(`${hname(d.h)} substitution · who comes off?`, d.h, { groups: [{ label: "On court", ids: lu.on }], extra, gkId: kt.current[d.h] });
      if (!out) return;
      const outId = out === "__short" ? null : out;
      if (!outId && waiting && !(await confirmSheet("Suspension still running", "Law 7: the team stays a player short for 1 minute of playing time, unless the opponent scores first. Bring the replacement on anyway?", "Bring on"))) return;
      const isGk = outId && outId === kt.current[d.h];
      const inId = await pickPlayer(`Who comes on${outId ? " for " + pname(outId) : ""}?`, d.h, { groups: [{ label: "Bench", ids: lu.bench, empty: "No substitutes available" }], note: isGk ? "The keeper is coming off, so this player goes in goal." : "" });
      if (!inId) return;
      const gender = id => (P(id) && P(id).gender === "F") ? "F" : "M";
      const men = lu.men - (outId && gender(outId) === "M" ? 1 : 0) + (gender(inId) === "M" ? 1 : 0);
      const women = lu.women - (outId && gender(outId) === "F" ? 1 : 0) + (gender(inId) === "F" ? 1 : 0);
      if (men > 5) return toast("That puts 6 men on court. Only 5 men are allowed.");
      if (women > 1) return toast("That puts 2 women on court. Only one woman spot is allowed.");
      await addD("events", { ...base, type: "sub", houseId: d.h, playerId: inId, outId });
      return toast(outId ? `${pname(inId)} on for ${pname(outId)}${isGk ? " · now in goal" : ""}` : `${pname(inId)} on · back to full strength`);
    }
    case "gkchange": {
      const pid = await pickPlayer(`Who goes in goal for ${hname(d.h)}?`, d.h, { groups: courtGroups(m, d.h, false), note: "Swap with a player already on court, during a stoppage. To bring a substitute on as keeper, use Substitution and take the keeper off.", exclude: L.keeperTimeline(S, m).current[d.h] }); if (!pid) return;
      await addD("events", { ...evBase(m), type: "gk", houseId: d.h, playerId: pid });
      return toast(`${pname(pid)} now in goal`);
    }
    case "yellow": case "red": {
      const base = evBase(m);
      const pid = await pickPlayer(`${a === "yellow" ? "Yellow" : "Red"} card · ${hname(d.h)}`, d.h, { groups: courtGroups(m, d.h, true) }); if (!pid) return;
      const prior = L.matchEvents(S, m.id).filter(e => e.playerId === pid);
      await addD("events", { ...base, type: a, houseId: d.h, playerId: pid });
      if (a === "yellow" && prior.some(e => e.type === "yellow") && !prior.some(e => e.type === "red")) {
        await addD("events", { ...base, ts: base.ts + 1, type: "red", houseId: d.h, playerId: pid, auto: true });
        return toast(`Second yellow · ${pname(pid)} sent off`);
      }
      return toast(`${a === "yellow" ? "Yellow" : "Red"} card · ${pname(pid)}`);
    }
    case "undo": {
      const evs = L.matchEvents(S, m.id); const e = evs[evs.length - 1]; if (!e) return;
      if (!(await confirmSheet("Undo the last event?", `${evText(e, m).replace(/<[^>]+>/g, "")} (${esc(hname(e.houseId))}, ${L.minuteOf(e, m, c)}′)`, "Undo", true))) return;
      return delD("events", e.id);
    }
    case "delev": {
      const e = S.events[d.e]; if (!e) return;
      if (!(await confirmSheet("Delete this event?", `${evText(e, S.matches[e.matchId]).replace(/<[^>]+>/g, "")} (${esc(hname(e.houseId))})`, "Delete", true))) return;
      return delD("events", e.id);
    }
    case "editmin": {
      const e = S.events[d.e]; if (!e) return;
      const em = S.matches[e.matchId], halfMin = L.halfMs(em, c) / 60000;
      let val = null;
      const v = await openSheet(`<h3>Change the minute</h3><p class="muted" style="margin:0">${evText(e, em).replace(/<[^>]+>/g, "")} (${esc(hname(e.houseId))}). Use this when copying a paper match sheet. Minutes 1–${halfMin} are the 1st half, ${halfMin + 1}–${halfMin * 2} the 2nd.</p>
        <input type="number" id="minIn" min="1" max="${halfMin * 2}" value="${L.minuteOf(e, em, c)}" aria-label="Minute">
        <div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-v="no">Cancel</button><button class="btn primary" type="button" data-v="ok">Save minute</button></div>`,
        (k, b) => { if (k === "ok") val = b.querySelector("#minIn").value; });
      if (v !== "ok") return;
      const n = Math.round(Number(val));
      if (!(n >= 1 && n <= halfMin * 2)) return toast(`Enter a minute from 1 to ${halfMin * 2}.`);
      const period = n > halfMin ? 2 : 1, local = period === 2 ? n - halfMin : n;
      await updD("events", e.id, { period, clockMs: (local - 1) * 60000 + 1000 });
      return toast(`Moved to ${n}′`);
    }
    case "shootfirst": return updD("matches", m.id, { shootFirst: d.h });
    case "kick": {
      const kicker = ($("#kicker") || {}).value, keeper = ($("#keeper") || {}).value;
      if (!kicker) return toast("Pick the kicker first.");
      await addD("kicks", { matchId: m.id, houseId: d.h, kickerId: kicker, keeperId: keeper || null, result: d.r, ts: now() });
      return toast(`${pname(kicker)} · ${d.r}`);
    }
    case "undokick": { const ks = L.matchKicks(S, m.id); const k = ks[ks.length - 1]; if (k) return delD("kicks", k.id); return; }
    case "confirmfinal": {
      const so = L.shootout(S, m);
      if (!(await confirmSheet(`${hname(so.winner)} are champions?`, "This saves the Final result.", "Confirm"))) return;
      await updD("matches", m.id, { status: "finished" });
      return toast(`${hname(so.winner)} win the Final`);
    }
    case "savehouse": {
      const r = Number($("#ht_" + d.h).value) || 0;
      await updD("houses", d.h, { name: $("#hn_" + d.h).value.trim() || hname(d.h), color: $("#hc_" + d.h).value, tiebreakRank: r, captain: $("#hcap_" + d.h).value.trim(), manager: $("#hman_" + d.h).value.trim() });
      return toast("House saved");
    }
    case "saveplayer": {
      await updD("players", d.p, { name: $("#pn_" + d.p).value.trim() || "Unnamed", houseId: $("#ph_" + d.p).value, gender: $("#pg_" + d.p).value, number: $("#pj_" + d.p).value.trim(), gk: $("#pk_" + d.p).checked });
      return toast("Player saved");
    }
    case "addplayer": {
      const n = L.housePlayers(S, d.h).length + 1;
      if (n > L.MAX_SQUAD) return toast("Squads are 12 players max.");
      await addD("players", { name: `${hname(d.h)} Player ${n}`, houseId: d.h, gender: "M", number: "", gk: false });
      return toast("Player added. Edit the name and save.");
    }
    case "delplayer": {
      const used = Object.values(S.events).some(e => e.playerId === d.p || e.assistId === d.p) || Object.values(S.kicks).some(k => k.kickerId === d.p || k.keeperId === d.p);
      if (used) return toast("This player has logged events. Delete those events first.");
      if (!(await confirmSheet(`Remove ${pname(d.p)}?`, "", "Remove", true))) return;
      return delD("players", d.p);
    }
    case "savefix": {
      const patch = { court: Number($("#fc_" + m.id).value), time: $("#ft_" + m.id).value };
      if ($("#fh_" + m.id) && m.status === "scheduled") {
        const h = $("#fh_" + m.id).value, a = $("#fa_" + m.id).value;
        if (h === a) return toast("A house can't play itself. Pick two different houses.");
        patch.homeId = h; patch.awayId = a;
        const pairs = {}; matchList().filter(x => x.stage === "league").forEach(x => { const k = [x.id === m.id ? h : x.homeId, x.id === m.id ? a : x.awayId].sort().join("-"); pairs[k] = (pairs[k] || 0) + 1; });
        const odd = Object.entries(pairs).filter(([, n]) => n !== 2);
        await updD("matches", m.id, patch);
        return toast(odd.length ? "Fixture saved. Check the draw: every pairing should appear exactly twice." : "Fixture saved");
      }
      await updD("matches", m.id, patch);
      return toast("Fixture saved");
    }
    case "saveweights": {
      const rd = (src, k) => { const v = Number($(`#w_${src}_${k}`).value); return Number.isFinite(v) ? v : c[src][k]; };
      const weights = {}, gkWeights = {};
      Object.keys(c.weights).forEach(k => { weights[k] = rd("weights", k); });
      Object.keys(c.gkWeights).forEach(k => { gkWeights[k] = rd("gkWeights", k); });
      await saveConfig({ weights, gkWeights });
      return toast("Award points saved");
    }
    case "savepin": {
      const v = $("#newPin").value.trim(); if (v.length < 4) return toast("Use at least 4 digits.");
      if (sheetMode) { try { await db.changePin(v); } catch (e) { return toast("Couldn't change the PIN. Check the connection."); } }
      else await saveConfig({ pin: v });
      $("#newPin").value = "";
      return toast("PIN changed");
    }
    case "reset": {
      if (!(await confirmSheet("Reset all results?", "Every event, card and shootout kick is deleted and all 13 matches go back to not started. This can't be undone.", "Reset everything", true))) return;
      for (const e of Object.values(S.events)) await delD("events", e.id);
      for (const k of Object.values(S.kicks)) await delD("kicks", k.id);
      for (const x of matchList()) await db.doc("matches/" + x.id).set({ id: x.id, no: x.no, round: x.round, court: x.court || 0, stage: x.stage, time: x.time || "",
        homeId: x.stage === "final" ? null : x.homeId, awayId: x.stage === "final" ? null : x.awayId, status: "scheduled", period: 1, running: false, elapsedMs: 0 });
      return toast("All results cleared");
    }
    case "resetfix": {
      const hs = houseList();
      if (hs.length !== 4) return toast("The starting draw needs exactly 4 houses.");
      const logged = Object.keys(S.events).length + Object.keys(S.kicks).length;
      const started = matchList().filter(x => x.status !== "scheduled").length;
      if (!(await confirmSheet("Reset fixtures to the starting draw?",
        `All 12 league matches go back to the original pairings, courts and rounds, and the Final goes back to 1st v 2nd.${started || logged ? `<br><br><b>This also clears ${started} started match${started === 1 ? "" : "es"} and ${logged} logged event${logged === 1 ? "" : "s"}</b> (goals, cards, subs, shootout kicks). Download a backup first if you might need them.` : ""}<br><br>Houses and players stay. This can't be undone.`,
        "Reset fixtures", true))) return;
      toast("Resetting fixtures…");
      try {
        for (const e of Object.values(S.events)) await delD("events", e.id);
        for (const k of Object.values(S.kicks)) await delD("kicks", k.id);
        const fresh = starterMatches(hs.map(h => h.id));
        for (const x of matchList()) if (!fresh["matches/" + x.id]) await delD("matches", x.id);
        for (const [p, d] of Object.entries(fresh)) await db.doc(p).set(d);
        selMatch = { 0: null, 1: null };
        return toast("Fixtures reset to the starting draw");
      } catch (e) { return toast("Reset didn't finish. Check the connection and try again."); }
    }
    case "template": return downloadTemplate();
    case "backup": return downloadBackup();
    case "starter": return loadStarter();
  }
}
async function saveConfig(patch) {
  if (S.config) return updD("meta", "config", patch);
  return setD("meta", "config", { ...L.DEFAULTS, ...patch });
}

/* clock adjust handled with a dedicated flow so we can read the input before the sheet closes */
async function adjustClock(m) {
  const c = C(), half = L.halfMs(m, c);
  let val = null;
  const v = await openSheet(`<h3>Set the clock</h3><p class="muted" style="margin:0">Time left in this half (mm:ss). Match it to the referee's watch.</p>
    <input type="text" id="clockIn" value="${L.fmtClock(half - Math.min(L.clockMs(m, now()), half))}" inputmode="numeric" aria-label="Time left">
    <div class="row" style="justify-content:flex-end"><button class="btn" type="button" data-v="no">Cancel</button><button class="btn primary" type="button" data-v="ok">Set clock</button></div>`,
    (k, b) => { if (k === "ok") val = b.querySelector("#clockIn").value; });
  if (v !== "ok" || !val) return;
  const mt = /^(\d{1,2}):(\d{2})$/.exec(val.trim());
  if (!mt) return toast("Use mm:ss, for example 04:30.");
  const left = (Number(mt[1]) * 60 + Number(mt[2])) * 1000;
  const elapsed = Math.max(0, Math.min(half, half - left));
  await updD("matches", m.id, { elapsedMs: elapsed, startedAt: m.running ? now() : null });
  toast("Clock set to " + L.fmtClock(half - elapsed));
}

/* ---------- Excel ---------- */
function needXLSX() { if (typeof XLSX === "undefined") { toast("The Excel library didn't load. Check the connection and reload."); return false; } return true; }
async function saveFile(name, wb) {
  if (!dl) return toast("Downloads aren't available in this view.");
  const data = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  try { await dl.save({ filename: name, data: new Blob([data]) }); toast("Saved " + name); }
  catch (e) { if (e && e.code !== "declined") toast("Couldn't save the file."); }
}
function downloadTemplate() {
  const rows = [["House", "Player Name", "Gender (M/F)", "Jersey No", "Goalkeeper (Y/N)"]];
  houseList().forEach(h => { for (let i = 1; i <= 6; i++) rows.push([h.name, "", i === 6 ? "F" : "M", "", i === 1 ? "Y" : "N"]); });
  saveText("Futsal-2026-player-template.csv", toCSV(rows));
}
async function importPlayers(file) {
  if (!guard()) return;
  if (Object.keys(S.events).length || Object.keys(S.kicks).length) return toast("Results are already logged. Edit players one by one instead, or reset results first.");
  let rows;
  if (/\.csv$/i.test(file.name) || file.type === "text/csv") rows = parseCSV(await file.text()).slice(1);
  else {
    if (!needXLSX()) return;
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const ws = wb.Sheets["Players"] || wb.Sheets[wb.SheetNames[0]];
    rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" }).slice(1);
  }
  const byName = {}; houseList().forEach(h => { byName[h.name.trim().toLowerCase()] = h.id; });
  const good = [], bad = [];
  rows.forEach((r, i) => {
    const [hn, nm, g, num, gk] = r.map(x => String(x).trim());
    if (!hn && !nm) return;
    const hid = byName[hn.toLowerCase()];
    if (!hid || !nm) { bad.push(i + 2); return; }
    good.push({ name: nm, houseId: hid, gender: /^f|^w/i.test(g) ? "F" : "M", number: num, gk: /^y/i.test(gk) });
  });
  if (!good.length) return toast("No players found. Check the House column matches your house names.");
  const over = houseList().filter(h => good.filter(p => p.houseId === h.id).length > L.MAX_SQUAD);
  if (over.length) return toast(`${over.map(h => h.name).join(", ")} has more than 12 players. Squads are 6 to 12.`);
  const counts = houseList().map(h => `${esc(h.name)}: ${good.filter(p => p.houseId === h.id).length}`).join(" · ");
  if (!(await confirmSheet(`Import ${good.length} players?`, `${counts}${bad.length ? `<br>Skipped rows ${bad.join(", ")} (unknown house or missing name).` : ""}<br>This replaces the current player list.`, "Replace players"))) return;
  for (const p of Object.values(S.players)) await delD("players", p.id);
  for (const p of good) await addD("players", p);
  toast(`Imported ${good.length} players`);
}
function exportAll() {
  const c = C(), st = L.standings(S), aw = L.awards(S, c), stats = L.playerStats(S, c);

  const add = (name, rows) => { sections.push(name, rows); };
  const res = [["Match", "Stage", "Round", "Court", "Time", "Home", "Home goals", "Away goals", "Away", "Half-time", "Penalties", "Winner", "Status", "Referee", "Scorer"]];
  matchList().forEach(m => { const ft = finalTeams(m); const r = L.started(m) ? L.result(S, m) : null;
    res.push([m.stage === "final" ? "Final" : m.no, m.stage, m.round || "", c.courts[m.court || 0], m.time || "", hname(ft.h), r ? r.h : "", r ? r.a : "", hname(ft.a), (ht => ht ? `${ht.h}-${ht.a}` : "")(L.halfTime(S, m)),
      r && r.pens ? `${r.pens.tally[m.homeId].g}-${r.pens.tally[m.awayId].g}` : "", r && m.status === "finished" ? (r.winner ? hname(r.winner) : "Draw") : "", m.status, m.referee || "", m.scorer || ""]); });
  add("Results", res, [7, 8, 6, 9, 7, 12, 10, 10, 12, 10, 12, 10]);
  const ev = [["Match", "Minute", "Half", "Event", "House", "Player", "Assist / player off", "Note"]];
  matchList().forEach(m => L.matchEvents(S, m.id).forEach(e => ev.push([m.stage === "final" ? "Final" : m.no, L.minuteOf(e, m, c), e.period, e.type === "sub" ? "substitution" : e.type, hname(e.houseId), e.playerId ? pname(e.playerId) : "", e.assistId ? pname(e.assistId) : (e.outId ? pname(e.outId) : ""), e.ownGoal ? "Own goal" : (e.auto ? "Second yellow" : (e.type === "sub" && !e.outId ? "Replaced sent-off player" : ""))])));
  add("Events", ev, [7, 7, 5, 12, 12, 24, 24, 22]);
  const lus = [["Match", "House", "Starting lineup", "Came on as sub", "Sent off"]];
  matchList().filter(L.started).forEach(m => { const st = L.lineupState(S, m); Object.entries(st).forEach(([h, x]) => { const start = (m.lineup && m.lineup[h]) || []; lus.push([m.stage === "final" ? "Final" : m.no, hname(h), start.map(pname).join(", "), [...x.appeared].filter(id => !start.includes(id)).map(pname).join(", "), [...x.sentOff].map(pname).join(", ")]); }); });
  add("Lineups", lus, [7, 12, 60, 40, 24]);
  const kk = [["Match", "Kick", "House", "Kicker", "Keeper", "Result"]];
  matchList().forEach(m => L.matchKicks(S, m.id).forEach((k, i) => kk.push(["Final", i + 1, hname(k.houseId), pname(k.kickerId), k.keeperId ? pname(k.keeperId) : "", k.result])));
  add("Shootout", kk, [7, 5, 12, 24, 24, 8]);
  const tb = [["Pos", "House", "P", "W", "D", "L", "GF", "GA", "GD", "Pts", "Separated by"]];
  st.forEach(r => tb.push([r.pos, hname(r.id), r.P, r.W, r.D, r.L, r.GF, r.GA, r.GD, r.Pts, r.reason ? r.reason.by : ""]));
  add("Standings", tb, [5, 12, 4, 4, 4, 4, 4, 4, 5, 5, 20]);
  const ps = [["Player", "House", "Gender", "Jersey", "GK", "Apps", "Goals", "Assists", "Saves", "Clean sheets", "GK matches", "GK clean sheets", "Conceded (in goal)", "Shootout saves", "Wins", "Yellow", "Red", "Best Player pts", "Goalkeeper pts"]];
  houseList().forEach(h => L.housePlayers(S, h.id).forEach(p => { const s = stats[p.id]; ps.push([p.name, h.name, p.gender === "F" ? "W" : "M", p.number || "", p.gk ? "Y" : "", s.apps, s.goals, s.assists, s.saves, s.cs, s.gkApps || "", s.gkApps ? s.gkCs : "", s.conceded, s.shootSaves, s.wins, s.yellow, s.red, s.best, s.gkApps ? s.gkPts : ""]); }));
  add("Player stats", ps, [24, 12, 7, 7, 4, 5, 6, 7, 6, 11, 16, 13, 5, 6, 5, 14, 13]);
  const awr = [["Award", "Rank", "Player", "House", "Value", "Detail"]];
  aw.scorers.slice(0, 5).forEach((p, i) => awr.push(["Top goal scorer", i + 1, p.name, hname(p.houseId), p.goals, `${p.assists} assists`]));
  aw.assists.slice(0, 5).forEach((p, i) => awr.push(["Top assists", i + 1, p.name, hname(p.houseId), p.assists, `${p.goals} goals`]));
  aw.keepers.slice(0, 5).forEach((p, i) => awr.push(["Best goalkeeper", i + 1, p.name, hname(p.houseId), p.gkPts, `${p.saves} saves, ${p.gkCs} clean sheets, ${p.conceded} conceded, ${p.shootSaves} shootout saves`]));
  aw.best.slice(0, 5).forEach((p, i) => awr.push(["Best player", i + 1, p.name, hname(p.houseId), p.best, `${p.goals}G ${p.assists}A ${p.wins}W`]));
  const ch = champion(); awr.push(["Champion house", 1, "", ch ? hname(ch.id) : "Not decided", "", ch ? `Won the Final ${ch.r.h}-${ch.r.a}${ch.r.pens ? " (" + ch.r.pens.tally[ch.f.homeId].g + "-" + ch.r.pens.tally[ch.f.awayId].g + " pens)" : ""}` : ""]);

  const out = [[c.title, c.venue, c.date, "Exported " + new Date().toLocaleString()]];
  order.forEach(name => { const i = sections.indexOf(name); if (i < 0) return; out.push([], ["== " + name.toUpperCase() + " =="], ...sections[i + 1]); });
  saveText(`futsal-report-${stamp()}.csv`, toCSV(out));
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]");
  if (t) { tab = t.getAttribute("data-tab"); ls.set("tab", tab); render(); return; }
  const b = e.target.closest("#view [data-act]");
  if (b) { const d = { ...b.dataset }; if (d.act === "adjust") { const m = S.matches[d.m]; if (m && guard()) adjustClock(m); return; } act(d.act, d).catch(() => {}); }
});
document.addEventListener("change", e => {
  if (e.target.id === "matchSel") { selMatch[court] = e.target.value; render(); }
  if (e.target.id === "restoreFile" && e.target.files[0]) { restoreBackup(e.target.files[0]).catch(() => toast("Couldn't read that backup.")); e.target.value = ""; }
  if (e.target.id === "importFile" && e.target.files[0]) { importPlayers(e.target.files[0]).catch(() => toast("Couldn't read that file. Use the template's .xlsx format.")); e.target.value = ""; }
});
