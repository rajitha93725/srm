<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangman — Gapstars 2026</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#05050f;--surf:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);
  --cyan:#00f5ff;--purple:#bf00ff;--pink:#ff007f;--green:#00ff88;
  --yellow:#ffe600;--red:#ff4455;--text:#e2e8f0;--dim:#64748b;--r:12px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,245,255,.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,245,255,.02) 1px,transparent 1px);background-size:52px 52px}
.blob{position:fixed;border-radius:50%;pointer-events:none;z-index:0}
.blob1{width:520px;height:520px;background:radial-gradient(circle,rgba(191,0,255,.07),transparent 70%);top:-130px;left:-130px}
.blob2{width:440px;height:440px;background:radial-gradient(circle,rgba(0,245,255,.05),transparent 70%);bottom:-90px;right:-90px}

.app-outer{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:14px 10px 48px}
.app-header{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:12px}
.app-grid{display:grid;grid-template-columns:1fr 172px;gap:14px;align-items:start}
@media(max-width:660px){.app-grid{grid-template-columns:1fr}}
.game-col{display:flex;flex-direction:column;gap:12px}

/* Header */
.logo{font-size:clamp(2.2rem,7vw,4rem);font-weight:900;letter-spacing:10px;text-transform:uppercase;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink),var(--cyan));
  background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradFlow 5s linear infinite;filter:drop-shadow(0 0 26px rgba(0,245,255,.4))}
@keyframes gradFlow{to{background-position:300%}}
.tagline{font-size:.68rem;color:var(--dim);letter-spacing:4px;text-transform:uppercase;margin-top:2px;text-align:center}

/* Score Bar */
.score-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.pill{background:var(--surf);border:1px solid var(--border);border-radius:30px;
  padding:5px 14px;backdrop-filter:blur(10px);display:flex;align-items:center;gap:6px}
.pill .lbl{font-size:.6rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.pill .val{font-size:.95rem;font-weight:800}
.pill.w .val{color:var(--green)}.pill.l .val{color:var(--red)}
.pill.s .val{color:var(--yellow)}.pill.b .val{color:var(--cyan)}

/* Stage */
.stage-wrap{width:100%;background:var(--surf);border:1px solid var(--border);
  border-radius:18px;padding:10px 8px 12px;backdrop-filter:blur(12px);
  display:flex;flex-direction:column;align-items:center;gap:10px}
#hm-svg{width:100%;max-width:640px;height:auto;display:block;overflow:visible}

/* SVG scene */
.star{animation:tw 2.8s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:.95}}
.bg-mtn{fill:rgba(18,8,36,.65);stroke:none}
.cliff-body{fill:rgba(22,12,48,.88);stroke:none}
.cliff-edge-line{fill:none;stroke:rgba(0,245,255,.3);stroke-width:2;stroke-linecap:round}
.cliff-drop{fill:none;stroke:rgba(255,68,85,.55);stroke-width:1.8;stroke-dasharray:6,3}
.grass{fill:none;stroke:rgba(0,255,136,.5);stroke-width:2;stroke-linecap:round}
.rock{fill:rgba(40,25,70,.9);stroke:rgba(0,245,255,.15);stroke-width:1}
.dp{stroke:rgba(255,68,85,.65);stroke-width:2.5;stroke-linecap:round;fill:none}
.ds{fill:rgba(255,68,85,.12);stroke:rgba(255,68,85,.55);stroke-width:1.5;rx:5}
.moon{fill:rgba(255,235,160,.1);stroke:rgba(255,235,160,.2);stroke-width:1}
.cloud{fill:rgba(255,255,255,.04);stroke:none}

/* Hangman character parts */
.cp{fill:none;stroke:var(--cyan);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.cp-fill{fill:white;stroke:none}
.cp-pupil{fill:#05050f;stroke:none}
.cp-btn{fill:var(--cyan);stroke:none}
.cp-mouth{fill:#05050f;stroke:var(--cyan);stroke-width:2.5}
.cp-brow{fill:none;stroke:var(--cyan);stroke-width:2.5;stroke-linecap:round}
.cp-sweat{fill:rgba(0,245,255,.55);stroke:none}
.cp-shadow{fill:rgba(0,0,0,.3);stroke:none}
.xeye{font-size:15px;fill:var(--red);text-anchor:middle;dominant-baseline:middle;
  opacity:0;transition:opacity .18s;font-weight:900;font-family:sans-serif}

/* Death = all char parts turn red */
.char-dead .cp{stroke:var(--red)!important}
.char-dead .cp-fill{fill:rgba(255,68,85,.2)!important}
.char-dead .cp-brow{stroke:var(--red)!important}

/* Strike dots */
.dots{display:flex;gap:9px;align-items:center}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--border);background:transparent;transition:all .3s}
.dot.hit{background:var(--red);border-color:var(--red);box-shadow:0 0 10px var(--red)}
.dots-lbl{font-size:.65rem;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-right:4px}

/* Word zone */
.word-zone{width:100%;display:flex;flex-direction:column;gap:11px}
.word-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 15px;
  border-radius:20px;font-size:.7rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  background:rgba(0,245,255,.08);color:var(--cyan);border:1px solid rgba(0,245,255,.28);width:fit-content}
.meta-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.att-box{background:var(--surf);border:1px solid var(--border);border-radius:10px;
  padding:5px 13px;display:flex;align-items:center;gap:7px;font-size:.74rem}
.att-lbl{color:var(--dim)}.att-val{font-weight:800;font-size:1.1rem}
.att-safe{color:var(--green)}.att-warn{color:var(--yellow)}.att-danger{color:var(--red)}
.word-display{display:flex;flex-wrap:wrap;gap:5px 7px;justify-content:center;
  padding:14px 10px;background:var(--surf);border:1px solid var(--border);
  border-radius:var(--r);min-height:68px;align-items:center}
.ls{display:flex;flex-direction:column;align-items:center;gap:4px}
.lc{font-size:clamp(1.4rem,4vw,2rem);font-weight:900;min-width:26px;height:34px;
  display:flex;align-items:center;justify-content:center;color:var(--cyan);text-transform:uppercase;
  opacity:0;transform:translateY(-8px) scale(.5);transition:all .36s cubic-bezier(.34,1.56,.64,1)}
.lc.vis{opacity:1;transform:none}
.ll{width:100%;min-width:24px;height:2px;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:2px}
.hint-row{font-size:.88rem;text-align:center;color:#cbd5e1;padding:10px 14px;
  background:rgba(255,230,0,.04);border:1px solid rgba(255,230,0,.18);border-radius:10px;line-height:1.55}
.hint-row span{color:var(--yellow);font-weight:600}
.wrong-lbl{font-size:.72rem;min-height:18px;text-align:center}
.kb-wrap{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:11px;backdrop-filter:blur(10px)}
.kb-title{font-size:.61rem;color:var(--dim);letter-spacing:2px;text-transform:uppercase;text-align:center;margin-bottom:8px}
.kb{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.kb-btn{width:35px;height:35px;border-radius:7px;border:1px solid rgba(0,245,255,.2);
  background:rgba(0,245,255,.05);color:var(--cyan);font-size:.76rem;font-weight:700;
  cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center;text-transform:uppercase}
.kb-btn:hover:not(:disabled){background:rgba(0,245,255,.14);border-color:var(--cyan);box-shadow:0 0 9px rgba(0,245,255,.25);transform:translateY(-1px)}
.kb-btn:active:not(:disabled){transform:scale(.9)}.kb-btn:disabled{cursor:default}
.kb-btn.hit-correct{background:rgba(0,255,136,.18);border-color:var(--green);color:var(--green);box-shadow:0 0 8px rgba(0,255,136,.3)}
.kb-btn.hit-wrong{background:rgba(255,68,85,.1);border-color:rgba(255,68,85,.25);color:rgba(255,68,85,.38)}
.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.btn{padding:8px 20px;border-radius:10px;border:none;cursor:pointer;font-size:.78rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:all .2s}
.btn-new{background:linear-gradient(135deg,rgba(0,245,255,.12),rgba(191,0,255,.12));border:1px solid rgba(0,245,255,.35);color:var(--cyan)}
.btn-new:hover{background:linear-gradient(135deg,rgba(0,245,255,.22),rgba(191,0,255,.22));transform:translateY(-2px)}
.btn-pick{background:rgba(255,230,0,.08);border:1px solid rgba(255,230,0,.3);color:var(--yellow)}
.btn-pick:hover{background:rgba(255,230,0,.16);transform:translateY(-2px)}

/* Modals */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;
  align-items:center;justify-content:center;backdrop-filter:blur(8px)}
.overlay.open{display:flex}
.modal{border-radius:22px;padding:32px 36px;text-align:center;max-width:380px;width:92%;
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1);
  background:linear-gradient(145deg,rgba(8,8,22,.98),rgba(14,4,28,.98))}
@keyframes popIn{from{transform:scale(.5) rotate(-6deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.modal.win{border:1px solid var(--green);box-shadow:0 0 60px rgba(0,255,136,.2)}
.modal.lose{border:1px solid var(--red);box-shadow:0 0 60px rgba(255,68,85,.2)}
.modal-emoji{font-size:3.5rem;display:block;margin-bottom:6px}
.modal-title{font-size:1.9rem;font-weight:900;letter-spacing:4px;text-transform:uppercase;margin-bottom:6px}
.modal.win .modal-title{color:var(--green);text-shadow:0 0 22px rgba(0,255,136,.5)}
.modal.lose .modal-title{color:var(--red);text-shadow:0 0 22px rgba(255,68,85,.5)}
.modal-word{font-size:1.4rem;font-weight:900;letter-spacing:6px;text-transform:uppercase;color:var(--cyan);margin:8px 0}
.modal-sub{font-size:.78rem;color:var(--dim);margin-bottom:18px}
.btn-again{padding:11px 30px;border-radius:12px;border:none;cursor:pointer;
  font-size:.84rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;transition:all .2s}
.modal.win .btn-again{background:linear-gradient(135deg,var(--green),#00cc66);color:#000;box-shadow:0 4px 18px rgba(0,255,136,.4)}
.modal.win .btn-again:hover{transform:scale(1.07)}
.modal.lose .btn-again{background:linear-gradient(135deg,var(--red),#cc0022);color:#fff;box-shadow:0 4px 18px rgba(255,68,85,.4)}
.modal.lose .btn-again:hover{transform:scale(1.07)}

/* Side panel */
.side-panel{background:var(--surf);border:1px solid var(--border);border-radius:16px;
  padding:14px 12px;display:flex;flex-direction:column;gap:8px;position:sticky;top:14px}
@media(max-width:660px){.side-panel{position:static}}
.sp-title{font-size:.62rem;color:var(--dim);letter-spacing:2px;text-transform:uppercase;
  text-align:center;padding-bottom:6px;border-bottom:1px solid var(--border)}
.sp-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.sp-btn{height:50px;border-radius:10px;border:2px solid rgba(0,245,255,.2);
  background:rgba(0,245,255,.04);color:var(--cyan);font-size:1.4rem;font-weight:900;
  cursor:pointer;transition:all .17s;display:flex;align-items:center;justify-content:center}
.sp-btn:hover{border-color:var(--cyan);background:rgba(0,245,255,.14);transform:scale(1.08)}
.sp-btn.sp-active{border-color:var(--yellow);color:var(--yellow);background:rgba(255,230,0,.1);
  box-shadow:0 0 10px rgba(255,230,0,.18)}
.sp-divider{height:1px;background:var(--border)}
.sp-hint-lbl{font-size:.6rem;color:var(--dim);letter-spacing:1px;text-transform:uppercase;text-align:center}
.hint-btn{width:100%;padding:8px 6px;border-radius:9px;font-size:.7rem;font-weight:700;
  cursor:pointer;font-family:inherit;letter-spacing:.3px;border:1px solid;transition:.2s}
.hint-btn.h1{background:rgba(255,230,0,.07);color:var(--yellow);border-color:rgba(255,230,0,.3)}
.hint-btn.h1:hover:not(:disabled){background:rgba(255,230,0,.16)}
.hint-btn.h2{background:rgba(0,255,136,.07);color:var(--green);border-color:rgba(0,255,136,.3)}
.hint-btn.h2:hover:not(:disabled){background:rgba(0,255,136,.16)}
.hint-btn:disabled{opacity:.35;cursor:default}
.hint-text-box{font-size:.82rem;color:#cbd5e1;line-height:1.6;padding:8px 9px;
  background:rgba(255,230,0,.04);border:1px solid rgba(255,230,0,.14);border-radius:8px;
  display:none;word-break:break-word}
.hint-text-box.show{display:block}

#cfx{position:fixed;inset:0;pointer-events:none;z-index:199;display:none}

@media(max-width:580px){.kb-btn{width:30px;height:30px;font-size:.7rem}.modal{padding:22px 14px}}
@media(max-width:360px){.kb-btn{width:27px;height:27px;font-size:.64rem}.kb{gap:3px}}
</style>
</head>
<body>
<div class="blob blob1"></div><div class="blob blob2"></div>
<canvas id="cfx"></canvas>

<!-- Win -->
<div class="overlay" id="win-overlay">
  <div class="modal win">
    <span class="modal-emoji">🏆</span>
    <div class="modal-title">You Win!</div>
    <div class="modal-word" id="win-word"></div>
    <div class="modal-sub" id="win-sub"></div>
    <button class="btn-again" onclick="sfx('click');closeModals();pickWord(-1)">▶ Next Word</button>
  </div>
</div>

<!-- Lose -->
<div class="overlay" id="lose-overlay">
  <div class="modal lose">
    <span class="modal-emoji">💀</span>
    <div class="modal-title">Game Over!</div>
    <div class="modal-sub">Better luck next time!</div>
    <button class="btn-again" onclick="sfx('click');closeModals();startGame(G.wordIndex)">↺ Try Again</button>
  </div>
</div>

<!-- App -->
<div class="app-outer">
  <div class="app-header">
    <div style="text-align:center">
      <div class="logo">Hangman</div>
      <div class="tagline">Gapstars Grand Table Clash 2026 · 3 strikes &amp; you're out</div>
    </div>
    <div class="score-bar">
      <div class="pill w"><span class="lbl">Wins</span><span class="val" id="s-wins">0</span></div>
      <div class="pill l"><span class="lbl">Losses</span><span class="val" id="s-losses">0</span></div>
      <div class="pill s"><span class="lbl">Streak</span><span class="val" id="s-streak">0</span></div>
      <div class="pill b"><span class="lbl">Best</span><span class="val" id="s-best">0</span></div>
    </div>
  </div><!-- /app-header -->

  <div class="app-grid">
  <div class="game-col">

  <!-- ══ HANGMAN STAGE (top) ══ -->
  <div class="stage-wrap">
    <svg id="hm-svg" viewBox="0 0 600 270" xmlns="http://www.w3.org/2000/svg">

      <!-- ── Sky / atmosphere ── -->
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#080520"/>
          <stop offset="100%" stop-color="#0d0825"/>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="600" height="270" fill="url(#skyGrad)"/>

      <!-- Nebula glow -->
      <ellipse cx="470" cy="65"  rx="90" ry="55"  fill="rgba(191,0,255,.06)"/>
      <ellipse cx="80"  cy="40"  rx="70" ry="40"  fill="rgba(0,245,255,.05)"/>

      <!-- Moon -->
      <circle cx="530" cy="48" r="32" class="moon"/>
      <circle cx="545" cy="38" r="32" fill="rgba(8,5,20,.95)"/><!-- crescent mask -->

      <!-- Stars -->
      <circle class="star" cx="22"  cy="18"  r="1.5" fill="rgba(255,255,255,.8)" style="animation-delay:.2s"/>
      <circle class="star" cx="72"  cy="9"   r="1.2" fill="rgba(255,255,255,.6)" style="animation-delay:.9s"/>
      <circle class="star" cx="130" cy="24"  r="1.5" fill="rgba(255,255,255,.7)" style="animation-delay:.4s"/>
      <circle class="star" cx="190" cy="8"   r="1"   fill="rgba(255,255,255,.5)" style="animation-delay:1.3s"/>
      <circle class="star" cx="248" cy="29"  r="1.2" fill="rgba(255,255,255,.6)" style="animation-delay:.7s"/>
      <circle class="star" cx="305" cy="11"  r="1.5" fill="rgba(255,255,255,.75)" style="animation-delay:1.8s"/>
      <circle class="star" cx="365" cy="22"  r="1"   fill="rgba(255,255,255,.5)" style="animation-delay:.3s"/>
      <circle class="star" cx="415" cy="14"  r="1.5" fill="rgba(255,255,255,.65)" style="animation-delay:1.1s"/>
      <circle class="star" cx="462" cy="35"  r="1"   fill="rgba(255,255,255,.4)" style="animation-delay:2.2s"/>

      <!-- Clouds -->
      <ellipse class="cloud" cx="145" cy="55" rx="55" ry="18"/>
      <ellipse class="cloud" cx="340" cy="42" rx="45" ry="15"/>

      <!-- Background mountain silhouettes -->
      <path class="bg-mtn"
        d="M0,270 L0,145 L45,90 L90,130 L155,65 L220,115 L295,50 L370,105 L435,60 L500,100 L555,65 L600,90 L600,270 Z"/>

      <!-- ── Cliff / main ground ── -->
      <!-- Cliff body -->
      <path class="cliff-body"
        d="M0,270 L0,220 L508,220 L522,230 L535,240 L570,234 L600,237 L600,270 Z"/>
      <!-- Cliff top surface edge -->
      <path class="cliff-edge-line" d="M0,220 L508,220 L522,230 L535,240"/>
      <!-- Danger drop line -->
      <path class="cliff-drop" d="M508,220 L522,230 L535,240 L538,270"/>

      <!-- Grass tufts on cliff top -->
      <path class="grass" d="M60,220 Q62,212 64,220"/>
      <path class="grass" d="M63,220 Q65,210 68,220"/>
      <path class="grass" d="M160,220 Q162,213 164,220"/>
      <path class="grass" d="M163,220 Q166,211 169,220"/>
      <path class="grass" d="M280,220 Q282,213 284,220"/>
      <path class="grass" d="M340,220 Q342,212 345,220"/>
      <path class="grass" d="M440,220 Q442,213 444,220"/>
      <path class="grass" d="M443,220 Q446,211 450,220"/>

      <!-- Rocks on cliff -->
      <ellipse class="rock" cx="110" cy="219" rx="14" ry="5"/>
      <ellipse class="rock" cx="230" cy="219" rx="10" ry="4"/>
      <ellipse class="rock" cx="390" cy="219" rx="12" ry="4"/>
      <ellipse class="rock" cx="470" cy="218" rx="8"  ry="3"/>

      <!-- Glow under cliff top -->
      <ellipse cx="250" cy="224" rx="220" ry="7" fill="rgba(0,245,255,.04)"/>

      <!-- Danger sign at cliff edge -->
      <line class="dp" x1="488" y1="220" x2="488" y2="172"/>
      <rect class="ds" x="458" y="158" width="60" height="26" rx="5"
        fill="rgba(255,68,85,.12)" stroke="rgba(255,68,85,.6)" stroke-width="1.5"/>
      <text x="488" y="174"
        style="font-size:11px;fill:rgba(255,68,85,.95);text-anchor:middle;dominant-baseline:middle;font-weight:900;font-family:sans-serif">⚠ EDGE</text>

      <!-- ════════════════════════════════
           CHARACTER — standing on cliff
           Center x=88, feet at y=220
           ALWAYS fully visible
           Walking = translate via JS rAF
      ════════════════════════════════ -->
      <!-- Outer wrapper: JS applies translate(dx, bobY) here -->
      <g id="hm-char-wrap">
        <!-- Inner: JS applies rotation lean here -->
        <g id="hm-body-g">

          <!-- Ground shadow -->
          <ellipse class="cp-shadow" cx="88" cy="222" rx="26" ry="6"/>

          <!-- ── FEET & LEGS ── -->
          <line class="cp" x1="80" y1="196" x2="71"  y2="218" stroke-width="5"/>
          <line class="cp" x1="96" y1="196" x2="105" y2="218" stroke-width="5"/>
          <ellipse class="cp" cx="67"  cy="221" rx="14" ry="6"/>
          <ellipse class="cp" cx="109" cy="221" rx="14" ry="6"/>

          <!-- ── BODY (chubby torso) ── -->
          <ellipse class="cp" cx="88" cy="172" rx="26" ry="24"/>

          <!-- Shirt buttons -->
          <circle class="cp-btn" cx="88" cy="159" r="3.2"/>
          <circle class="cp-btn" cx="88" cy="172" r="3.2"/>
          <circle class="cp-btn" cx="88" cy="185" r="3.2"/>

          <!-- ── ARMS ── -->
          <!-- Left arm bent with round fist -->
          <path class="cp" d="M63,162 Q38,170 30,190" stroke-width="4"/>
          <circle class="cp" cx="27" cy="194" r="9"/>
          <!-- Right arm -->
          <path class="cp" d="M113,162 Q138,170 146,190" stroke-width="4"/>
          <circle class="cp" cx="149" cy="194" r="9"/>

          <!-- ── HEAD ── -->
          <circle class="cp" cx="88" cy="126" r="32"/>

          <!-- Spiky hair -->
          <path class="cp"
            d="M57,113 L52,91 L65,108 L72,84 L81,106 L88,78 L95,106 L104,84 L111,108 L124,91 L119,113"
            fill="none" stroke-width="3"/>

          <!-- Eyebrows (scared arched) -->
          <path class="cp-brow" d="M71,112 Q79,105 87,111"/>
          <path class="cp-brow" d="M89,111 Q97,105 105,112"/>

          <!-- Eyes whites -->
          <circle class="cp-fill" cx="78"  cy="122" r="10"/>
          <circle class="cp-fill" cx="98"  cy="122" r="10"/>
          <!-- Pupils -->
          <circle class="cp-pupil" cx="79"  cy="123" r="4.5"/>
          <circle class="cp-pupil" cx="99"  cy="123" r="4.5"/>
          <!-- Eye shine dots -->
          <circle fill="white" cx="81"  cy="121" r="1.5" stroke="none"/>
          <circle fill="white" cx="101" cy="121" r="1.5" stroke="none"/>

          <!-- Nose (tiny bump) -->
          <path class="cp" d="M86,133 Q88,138 90,133" stroke-width="2" fill="none"/>

          <!-- Mouth — scared O shape -->
          <ellipse class="cp-mouth" cx="88" cy="145" rx="9" ry="7"/>

          <!-- Cartoon sweat drop (right side of head) -->
          <path class="cp-sweat" d="M124,103 Q130,116 124,125 Q118,116 124,103 Z"/>

          <!-- X eyes — only visible on death -->
          <text id="hm-xeye-l" class="xeye" x="78"  y="126">✕</text>
          <text id="hm-xeye-r" class="xeye" x="98"  y="126">✕</text>

        </g><!-- /hm-body-g -->
      </g><!-- /hm-char-wrap -->

    </svg><!-- /hm-svg -->

    <!-- Strike dots -->
    <div class="dots">
      <span class="dots-lbl">Strikes</span>
      <div class="dot" id="d0"></div>
      <div class="dot" id="d1"></div>
      <div class="dot" id="d2"></div>
    </div>
  </div><!-- /stage-wrap -->

  <!-- ══ WORD + KEYBOARD (below) ══ -->
  <div class="word-zone">
    <div class="meta-row">
      <div class="word-badge" id="word-badge">⚡ PICK A WORD</div>
      <div class="att-box">
        <span class="att-lbl">Left</span>
        <span class="att-val att-safe" id="att-val">3</span>
      </div>
    </div>

    <div class="word-display" id="word-display">
      <div style="color:var(--dim);font-size:.76rem;letter-spacing:2px;text-transform:uppercase">Pick a word to start</div>
    </div>

    <div class="hint-row" id="hint-row" style="display:none">Hint: <span id="hint-text"></span></div>
    <div class="wrong-lbl" id="wrong-lbl"></div>

    <div class="kb-wrap">
      <div class="kb-title">Keyboard — or type on your physical keyboard</div>
      <div class="kb" id="kb"></div>
    </div>

    <div class="actions">
      <button class="btn btn-new" onclick="sfx('click');pickWord(-1)">↺ Random Word</button>
    </div>
  </div><!-- /word-zone -->

  </div><!-- /game-col -->

  <!-- ══ SIDE PANEL ══ -->
  <div class="side-panel">
    <div class="sp-title">⚡ Pick a Word</div>
    <div class="sp-grid" id="wp-grid"></div>
    <div id="hint-section" style="display:none">
      <div class="sp-divider"></div>
      <div class="sp-hint-lbl">Hints</div>
      <button class="hint-btn h1" id="hint1-btn" onclick="useHint1()">💡 Text Hint</button>
      <button class="hint-btn h2" id="hint2-btn" onclick="useHint2()">🔤 Show Letters</button>
      <div class="hint-text-box" id="hint-text-box"></div>
    </div>
  </div>

  </div><!-- /app-grid -->
</div><!-- /app-outer -->

<script>
/* ═══════════════════════════════════════════════
   8 TOURNAMENT WORDS  (update w: and h: here)
═══════════════════════════════════════════════ */
const WORDS = [
  { w:'PHYSIQUE',  h:'The form, size, and development of a person\'s body.',          r:['S','U'] },
  { w:'SYLLABUS',  h:'A planned outline of what will be covered.',                    r:['L','A'] },
  { w:'TRANQUIL',  h:'Calm and peaceful.',                                            r:['R','L'] },
  { w:'HYPNOTIC',  h:'A mesmerizing quality that captures the mind.',                 r:['P','I'] },
  { w:'GLYCERIN',  h:'A polyol compound widely used in skincare, food and industry.', r:['L','I'] },
  { w:'BLIZZARD',  h:'A severe snowstorm with low visibility.',                       r:['L','A'] },
  { w:'SQUEAKED',  h:'Barely passed or escaped a situation.',                         r:['E']     },
  { w:'CRYPTIC',   h:'Having a meaning that is mysterious, obscure, or hidden.',      r:['T','C'] },
];

/* ═══════════════════════════════════════════════
   AUDIO
═══════════════════════════════════════════════ */
let _actx=null;
function actx(){
  if(!_actx)_actx=new(window.AudioContext||window.webkitAudioContext)();
  if(_actx.state==='suspended')_actx.resume();return _actx;
}
function tone(f,type,dur,vol=0.26,at=0){
  try{const c=actx(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type=type;
    o.frequency.setValueAtTime(f,c.currentTime+at);
    g.gain.setValueAtTime(.001,c.currentTime+at);
    g.gain.linearRampToValueAtTime(vol,c.currentTime+at+.014);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+at+dur);
    o.start(c.currentTime+at);o.stop(c.currentTime+at+dur+.05);}catch(e){}
}
function slide(f0,f1,type,dur,vol=0.24,at=0){
  try{const c=actx(),o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type=type;
    o.frequency.setValueAtTime(f0,c.currentTime+at);
    o.frequency.exponentialRampToValueAtTime(f1,c.currentTime+at+dur);
    g.gain.setValueAtTime(vol,c.currentTime+at);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+at+dur+.04);
    o.start(c.currentTime+at);o.stop(c.currentTime+at+dur+.08);}catch(e){}
}
function vib(f,dur,vol=0.22,at=0){
  try{const c=actx(),o=c.createOscillator(),g=c.createGain(),
    lfo=c.createOscillator(),lg=c.createGain();
    lfo.connect(lg);lg.connect(o.frequency);lg.gain.value=20;lfo.frequency.value=11;
    o.connect(g);g.connect(c.destination);o.type='triangle';o.frequency.value=f;
    g.gain.setValueAtTime(vol,c.currentTime+at);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+at+dur);
    lfo.start(c.currentTime+at);lfo.stop(c.currentTime+at+dur+.1);
    o.start(c.currentTime+at);o.stop(c.currentTime+at+dur+.1);}catch(e){}
}
const SFX={
  correct(){tone(523,'triangle',.13,.24,0);tone(659,'triangle',.13,.24,.09);tone(784,'triangle',.13,.24,.18);vib(1047,.42,.2,.28);},
  wrong(){slide(420,75,'sawtooth',.55,.26,0);tone(200,'square',.07,.1,.06);tone(178,'square',.07,.1,.18);tone(200,'square',.07,.1,.30);},
  win(){tone(392,'square',.11,.3,0);tone(392,'square',.11,.3,.13);tone(392,'square',.11,.3,.26);
    tone(523,'square',.6,.42,.39);[659,784,988,1047,1175,1319,1568].forEach((f,i)=>tone(f,'triangle',.2,.26,.95+i*.08));vib(1568,.9,.3,1.52);},
  lose(){tone(554,'sawtooth',.24,.3,0);tone(494,'sawtooth',.24,.3,.28);tone(440,'sawtooth',.24,.3,.56);slide(370,180,'sawtooth',.75,.38,.84);},
  click(){slide(800,380,'sine',.06,.18);}
};
function sfx(n){try{SFX[n]?.();}catch(e){}}

/* ═══════════════════════════════════════════════
   GAME STATE
═══════════════════════════════════════════════ */
const G={
  word:'', hint:'', reveal:[], wordIndex:-1,
  guessed:new Set(), wrong:0, maxWrong:3, over:false,
  charX:0,
  hint1Used:false, hint2Used:false,
  score:{wins:0,losses:0,streak:0,best:0},
};

/* Walk target positions (SVG units from character base x=88) */
const WALK_POS = [0, 135, 270, 392];  // 0=start, then 3 steps toward edge

/* ═══════════════════════════════════════════════
   ANIMATION — walk & fall using rAF + SVG transform attr
═══════════════════════════════════════════════ */
let _rafId = null;

function easeInOut(t){return t<.5?2*t*t:-1+(4-2*t)*t;}

function animWalk(fromX, toX, duration, onDone){
  if(_rafId) cancelAnimationFrame(_rafId);
  const wrap = document.getElementById('hm-char-wrap');
  const body = document.getElementById('hm-body-g');
  const t0 = performance.now();

  function step(now){
    const raw = Math.min((now - t0) / duration, 1);
    const t   = easeInOut(raw);
    const dx  = fromX + (toX - fromX) * t;
    // Bob: absolute-value sine creates a "bounce per step" feel
    const bobY = -Math.abs(Math.sin(raw * Math.PI * 5)) * 6;
    // Lean side to side
    const lean = Math.sin(raw * Math.PI * 5) * 5;

    wrap.setAttribute('transform', `translate(${dx},${bobY})`);
    body.setAttribute('transform', `rotate(${lean},88,200)`);

    if(raw < 1){
      _rafId = requestAnimationFrame(step);
    } else {
      wrap.setAttribute('transform', `translate(${toX},0)`);
      body.setAttribute('transform', '');
      G.charX = toX;
      _rafId = null;
      if(onDone) onDone();
    }
  }
  _rafId = requestAnimationFrame(step);
}

function animFall(fromX, onDone){
  if(_rafId) cancelAnimationFrame(_rafId);
  const wrap = document.getElementById('hm-char-wrap');
  const body = document.getElementById('hm-body-g');
  const t0 = performance.now();
  const DUR = 2600;

  // Show X eyes, colour red
  showXEyes();
  document.getElementById('hm-body-g').classList.add('char-dead');

  function step(now){
    const raw = Math.min((now - t0) / DUR, 1);
    let dx, dy, rot, op;

    if(raw < 0.28){
      // Walk to very edge (adds 40 more units)
      const t = raw / 0.28;
      dx  = fromX + 40 * easeInOut(t);
      dy  = -Math.abs(Math.sin(t * Math.PI * 2)) * 5;
      rot = Math.sin(t * Math.PI * 2) * 4;
      op  = 1;
    } else if(raw < 0.45){
      // Wile E. Coyote moment — hang in air
      const t = (raw - 0.28) / 0.17;
      dx  = fromX + 40;
      dy  = -4 - t * 5;       // creeps up slightly
      rot = -3 + t * 8;       // leans forward slowly
      op  = 1;
    } else {
      // FALL
      const t = (raw - 0.45) / 0.55;
      const acc = t * t * t;  // accelerating fall
      dx  = fromX + 40 + t * 22;
      dy  = -9 + acc * 340;
      rot = 5 + t * 88;
      op  = Math.max(0, 1 - t * 1.3);
    }

    wrap.setAttribute('transform', `translate(${dx},${dy})`);
    body.setAttribute('transform', `rotate(${rot},88,185)`);
    wrap.style.opacity = op;

    if(raw < 1 && op > 0){
      _rafId = requestAnimationFrame(step);
    } else {
      wrap.style.opacity = '0';
      _rafId = null;
      if(onDone) onDone();
    }
  }
  _rafId = requestAnimationFrame(step);
}

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
function init(){
  buildKeyboard(); buildWordPicker(); updateScoreUI();
  document.addEventListener('keydown', e => {
    const k = e.key.toUpperCase();
    if(/^[A-Z]$/.test(k) && !G.over && G.word){ sfx('click'); guess(k); }
    if(e.key === 'Enter')  pickWord(-1);
    if(e.key === 'Escape') closeAll();
  });
  // Side panel always visible — no auto-open needed
}

function buildKeyboard(){
  const kb = document.getElementById('kb'); kb.innerHTML = '';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l => {
    const b = document.createElement('button');
    b.className='kb-btn'; b.id=`k-${l}`; b.textContent=l;
    b.addEventListener('click', () => { sfx('click'); guess(l); });
    kb.appendChild(b);
  });
}

function buildWordPicker(){
  const grid = document.getElementById('wp-grid'); grid.innerHTML = '';
  WORDS.forEach((_,i) => {
    const b = document.createElement('button');
    b.className='sp-btn'; b.id=`wp-${i}`; b.textContent=i+1;
    b.addEventListener('click', () => pickWord(i));
    grid.appendChild(b);
  });
}

/* ═══════════════════════════════════════════════
   WORD PICKER
═══════════════════════════════════════════════ */
function openWordPicker(){ /* side panel always visible — no-op */ }

function pickWord(idx){
  sfx('click');
  closeModals(); stopConfetti();
  const i = idx < 0 ? (Math.random() * WORDS.length | 0) : idx;
  document.querySelectorAll('.sp-btn').forEach((b,j) =>
    b.classList.toggle('sp-active', j === i));
  startGame(i);
}

/* ═══════════════════════════════════════════════
   START GAME
═══════════════════════════════════════════════ */
function startGame(idx){
  if(_rafId){ cancelAnimationFrame(_rafId); _rafId = null; }

  const entry = WORDS[idx];
  G.wordIndex = idx; G.word = entry.w.toUpperCase(); G.hint = entry.h; G.reveal = entry.r || [];
  G.guessed = new Set(); G.wrong = 0; G.over = false;
  G.hint1Used = false; G.hint2Used = false;
  const hs = document.getElementById('hint-section');
  if(hs) hs.style.display = '';
  const h1b = document.getElementById('hint1-btn');
  const h2b = document.getElementById('hint2-btn');
  const htb = document.getElementById('hint-text-box');
  if(h1b){ h1b.disabled=false; h1b.textContent='💡 Text Hint'; }
  if(h2b){ h2b.disabled=false; h2b.textContent='🔤 Show Letters'; }
  if(htb){ htb.classList.remove('show'); htb.textContent=''; }

  // Reset character position
  G.charX = 0;
  const wrap = document.getElementById('hm-char-wrap');
  const body = document.getElementById('hm-body-g');
  wrap.setAttribute('transform', 'translate(0,0)');
  wrap.style.opacity = '1';
  body.setAttribute('transform', '');
  body.classList.remove('char-dead');
  hideXEyes();

  resetKeyboardUI();
  renderWord(); renderMeta(); renderStrikes(); renderAttempts(); renderWrong(); updateScoreUI();
}

/* ═══════════════════════════════════════════════
   GUESS
═══════════════════════════════════════════════ */
function guess(letter){
  if(G.over || !G.word || G.guessed.has(letter)) return;
  G.guessed.add(letter);
  const btn = document.getElementById(`k-${letter}`);
  if(btn) btn.disabled = true;

  if(G.word.includes(letter)){
    btn?.classList.add('hit-correct');
    sfx('correct'); revealLetter(letter);
    if(isComplete()){
      G.over = true;
      G.score.wins++; G.score.streak++;
      G.score.best = Math.max(G.score.best, G.score.streak);
      updateScoreUI();
      setTimeout(() => { showWin(); sfx('win'); startConfetti(); }, 500);
    }
  } else {
    btn?.classList.add('hit-wrong');
    sfx('wrong');
    G.wrong++;
    renderStrikes(); renderAttempts(); renderWrong();

    const step = G.wrong; // 1, 2, or 3
    const fromX = G.charX;
    const toX   = WALK_POS[step];

    if(step < 3){
      // Walk toward edge
      animWalk(fromX, toX, 1100, null);
    } else {
      // Walk to edge then fall off!
      G.over = true;
      G.score.losses++; G.score.streak = 0;
      updateScoreUI();
      // First walk to final position, then fall
      animWalk(fromX, toX, 900, () => {
        setTimeout(() => {
          animFall(toX, () => {
            setTimeout(() => { showLose(); sfx('lose'); }, 300);
          });
        }, 350);
      });
    }
  }
}

/* ═══════════════════════════════════════════════
   RENDER HELPERS
═══════════════════════════════════════════════ */
function renderWord(){
  const d = document.getElementById('word-display');
  if(!G.word){
    d.innerHTML = '<div style="color:var(--dim);font-size:.76rem;letter-spacing:2px;text-transform:uppercase">Pick a word to start</div>';
    return;
  }
  d.innerHTML = G.word.split('').map(ch => {
    if(ch === ' ') return '<div style="width:16px"></div>';
    const v = G.guessed.has(ch) ? ' vis' : '';
    return `<div class="ls"><div class="lc${v}" data-ch="${ch}">${ch}</div><div class="ll"></div></div>`;
  }).join('');
}

function revealLetter(l){
  let delay = 0;
  document.querySelectorAll(`.lc[data-ch="${l}"]`).forEach(el => {
    setTimeout(() => el.classList.add('vis'), delay);
    delay += 90;
  });
}

function isComplete(){
  return G.word.split('').every(c => c === ' ' || G.guessed.has(c));
}

function renderMeta(){
  document.getElementById('word-badge').textContent =
    G.wordIndex >= 0 ? `WORD ${G.wordIndex+1} / ${WORDS.length}` : '⚡ PICK A WORD';
  const hr = document.getElementById('hint-row');
  if(hr) hr.style.display='none';
}

function useHint1(){
  if(G.hint1Used || !G.word) return;
  G.hint1Used = true;
  const btn = document.getElementById('hint1-btn');
  if(btn){ btn.disabled=true; btn.textContent='💡 Hint Shown'; }
  // Side panel small box
  const box = document.getElementById('hint-text-box');
  if(box){ box.textContent=G.hint; box.classList.add('show'); }
  // Main area hint row (between word and keyboard)
  const hr = document.getElementById('hint-row');
  const ht = document.getElementById('hint-text');
  if(hr && ht){ ht.textContent=G.hint; hr.style.display=''; }
}

function useHint2(){
  if(G.hint2Used || !G.word || G.over) return;
  G.hint2Used = true;
  const btn = document.getElementById('hint2-btn');
  if(btn){ btn.disabled=true; btn.textContent='🔤 Letters Shown'; }
  G.reveal.forEach((letter, i) => {
    setTimeout(() => {
      if(!G.guessed.has(letter)){
        G.guessed.add(letter);
        const kbBtn = document.getElementById(`k-${letter}`);
        if(kbBtn){ kbBtn.disabled=true; kbBtn.classList.add('hit-correct'); }
        revealLetter(letter);
        sfx('correct');
      }
    }, i * 380);
  });
  setTimeout(() => {
    if(!G.over && isComplete()){
      G.over=true; G.score.wins++; G.score.streak++;
      G.score.best=Math.max(G.score.best,G.score.streak);
      updateScoreUI();
      setTimeout(()=>{showWin();sfx('win');startConfetti();},300);
    }
  }, G.reveal.length * 380 + 150);
}

function renderStrikes(){
  for(let i=0;i<3;i++) document.getElementById(`d${i}`).classList.toggle('hit', i < G.wrong);
}

function renderAttempts(){
  const l = G.maxWrong - G.wrong;
  const el = document.getElementById('att-val');
  el.textContent = l;
  el.className = `att-val ${l<=1?'att-danger':l<=2?'att-warn':'att-safe'}`;
}

function renderWrong(){
  const w = [...G.guessed].filter(l => !G.word.includes(l));
  document.getElementById('wrong-lbl').innerHTML = w.length
    ? `<span style="color:var(--dim)">Wrong: </span>` + w.map(l =>
        `<span style="color:var(--red);font-weight:700;margin:0 2px">${l}</span>`).join('')
    : '';
}

function updateScoreUI(){
  document.getElementById('s-wins').textContent    = G.score.wins;
  document.getElementById('s-losses').textContent  = G.score.losses;
  document.getElementById('s-streak').textContent  = G.score.streak;
  document.getElementById('s-best').textContent    = G.score.best;
}

function resetKeyboardUI(){
  document.querySelectorAll('.kb-btn').forEach(b => { b.className='kb-btn'; b.disabled=false; });
}

/* ═══════════════════════════════════════════════
   CHARACTER HELPERS
═══════════════════════════════════════════════ */
function showXEyes(){
  document.getElementById('hm-xeye-l').style.opacity = '1';
  document.getElementById('hm-xeye-r').style.opacity = '1';
  // Hide normal pupils
  document.querySelectorAll('.cp-pupil').forEach(el => el.style.opacity='0');
}

function hideXEyes(){
  document.getElementById('hm-xeye-l').style.opacity = '0';
  document.getElementById('hm-xeye-r').style.opacity = '0';
  document.querySelectorAll('.cp-pupil').forEach(el => el.style.opacity='');
}

/* ═══════════════════════════════════════════════
   MODALS
═══════════════════════════════════════════════ */
function showWin(){
  G.word.split('').forEach(c =>
    document.querySelectorAll(`.lc[data-ch="${c}"]`).forEach(el => el.classList.add('vis')));
  document.getElementById('win-word').textContent = G.word;
  document.getElementById('win-sub').textContent  =
    G.wrong === 0 ? '🎯 Perfect — zero wrong guesses!' :
    `Solved with ${G.wrong} wrong guess${G.wrong>1?'es':''}`;
  document.getElementById('win-overlay').classList.add('open');
}

function showLose(){
  // NO word reveal on loss — intentional
  document.getElementById('lose-overlay').classList.add('open');
}

function closeModals(){
  document.getElementById('win-overlay').classList.remove('open');
  document.getElementById('lose-overlay').classList.remove('open');
}

function closeAll(){
  closeModals();
}

/* ═══════════════════════════════════════════════
   CONFETTI
═══════════════════════════════════════════════ */
let _cfxId=null;
function startConfetti(){
  const cv=document.getElementById('cfx'),ctx=cv.getContext('2d');
  cv.style.display='block'; cv.width=window.innerWidth; cv.height=window.innerHeight;
  const C=['#00f5ff','#bf00ff','#ff007f','#00ff88','#ffe600','#ff6633','#ffffff'];
  const P=Array.from({length:160},()=>({
    x:Math.random()*cv.width, y:Math.random()*cv.height-cv.height,
    w:Math.random()*12+4, h:Math.random()*5+3,
    col:C[Math.random()*C.length|0],
    vx:(Math.random()-.5)*3, vy:Math.random()*3.5+1.8,
    rot:Math.random()*360, spin:(Math.random()-.5)*7, alpha:1,
  }));
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height); let alive=false;
    P.forEach(p=>{
      if(p.alpha<=0)return; alive=true;
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.spin;
      if(p.y>cv.height*.6) p.alpha-=.016;
      ctx.save(); ctx.globalAlpha=Math.max(0,p.alpha);
      ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.col; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    _cfxId=alive?requestAnimationFrame(draw):(stopConfetti(),null);
  }
  if(_cfxId)cancelAnimationFrame(_cfxId); draw();
}
function stopConfetti(){
  if(_cfxId){cancelAnimationFrame(_cfxId);_cfxId=null;}
  const cv=document.getElementById('cfx');
  cv.style.display='none'; cv.getContext('2d').clearRect(0,0,cv.width,cv.height);
}

init();
</script>
